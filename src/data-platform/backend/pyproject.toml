[project]
name = "table-maintenance-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "kubernetes>=32.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyiceberg>=0.9",
    "pyarrow>=18",
    "temporalio>=1.8",
    "confluent-kafka>=2.6,<3",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-mock>=3",
    "ty>=0.0.27",
    "import-linter>=2.11",
    "pyiceberg[pyiceberg-core]",
]

[tool.ruff]
extend = "../../../ruff.toml"

[tool.ruff.lint.isort]
known-first-party = ["base", "bootstrap", "context", "tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "base.ValueObject",
    "base.EntityId",
    "base.Entity",
    "base.AggregateRoot",
    "base.DomainEvent",
]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.FastAPI.get",
    "temporalio.activity.defn",
    "temporalio.workflow.defn",
    "temporalio.workflow.init",
    "temporalio.workflow.query",
    "temporalio.workflow.run",
    "temporalio.workflow.signal",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

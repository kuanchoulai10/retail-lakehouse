[project]
name = "table-maintenance-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "kubernetes>=32.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pyiceberg>=0.9",
    "pyarrow>=18",
    "temporalio>=1.8",
    "confluent-kafka>=2.6,<3",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-mock>=3",
    "ty>=0.0.27",
    "import-linter>=2.11",
    "pyiceberg[pyiceberg-core]",
]

[tool.ruff]
extend = "../../../ruff.toml"

[tool.ruff.lint.extend-per-file-ignores]
"base/**" = ["B024", "TC001", "UP046"]
"bootstrap/**" = ["D104"]
"context/**" = ["D102", "D103", "D104", "D107", "E501", "PLC0414", "PLR0911", "TC001", "TC003"]
"entrypoint.py" = []
"tests/**" = [
    "A002", "B008", "B905", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D403",
    "E501", "ERA001", "PLC0207", "PLR1714", "PLW0108", "PYI034", "TC001", "TC002", "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["base", "bootstrap", "context", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Platform Console</title>
    <script>
      (function () {
        var theme = null;
        try {
          theme = window.localStorage.getItem("ds-theme");
        } catch (error) {
          theme = null;
        }
        if (theme === "asagi" || theme === "kurikawa") {
          document.documentElement.setAttribute("data-panda-theme", theme);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

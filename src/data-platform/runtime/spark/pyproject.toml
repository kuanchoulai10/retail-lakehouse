[project]
name = "table-maintenance-spark"
version = "0.1.0"
description = "Spark runtime for Iceberg table maintenance (expire_snapshots, remove_orphan_files, rewrite_data_files, rewrite_manifests)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=4.0,<4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  dev:
    taskfile: ../../dev.yml
    dir: ../../..
    internal: true
  scripts:
    taskfile: ../../../scripts/Taskfile.yml
    dir: ../../../scripts
    internal: true
  design-system:
    taskfile: ../../../src/design-system/Taskfile.yml
    dir: ../../../src/design-system
    internal: true
  console:
    taskfile: ../../../src/data-platform/frontend/Taskfile.yml
    dir: ../../../src/data-platform/frontend
    internal: true
  backend:
    taskfile: ../../../src/data-platform/backend/Taskfile.yml
    dir: ../../../src/data-platform/backend
    internal: true
  spark:
    taskfile: ../../../src/data-platform/runtime/spark/Taskfile.yml
    dir: ../../../src/data-platform/runtime/spark
    internal: true

tasks:
  frontend:
    desc: "Run the design-system and console unit tests, then their story browser tests"
    deps:
      - design-system:unit-test
      - console:unit-test
    cmds:
      - task: design-system:component-test
      - task: console:component-test

  backend:
    desc: "Run the backend and Spark unit tests, then the backend's import-linter boundaries"
    deps:
      - backend:unit-test
      - spark:unit-test
    cmds:
      - task: backend:arch-test

  contract-test:
    summary: "Check the contracts between components"
    cmds:
      - task: contract-test-console-api
      - cmd: echo "TODO:// backend Polaris adapters vs the Polaris 1.8 OpenAPI; backend SparkApplication manifest vs the Spark Operator CRD"

  contract-test-console-api:
    summary: "Check that the committed openapi.json and the console's generated client match the backend"
    cmds:
      - task: dev:generate-api
      - git diff --exit-code -- src/data-platform/backend/openapi.json src/data-platform/frontend/src/api/generated
      - test -z "$(git status --porcelain -- src/data-platform/frontend/src/api/generated)"

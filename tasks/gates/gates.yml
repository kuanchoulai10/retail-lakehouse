# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  pre-commit:
    taskfile: ./pre-commit/pre-commit.yml
    dir: '{{.ROOT_DIR}}'
  pre-pr:
    taskfile: ./pre-pr/pre-pr.yml
    dir: '{{.ROOT_DIR}}'
  pre-merge:
    taskfile: ./pre-merge/pre-merge.yml
    dir: '{{.ROOT_DIR}}'
  post-merge:
    taskfile: ./post-merge/post-merge.yml
    dir: '{{.ROOT_DIR}}'
  pre-release:
    taskfile: ./pre-release/pre-release.yml
    dir: '{{.ROOT_DIR}}'
  release:
    taskfile: ./release/release.yml
    dir: '{{.ROOT_DIR}}'
  nightly:
    taskfile: ./nightly/nightly.yml
    dir: '{{.ROOT_DIR}}'

tasks:
  pre-commit:
    desc: "Gate: is the code clean? (before a commit: lint, format, type) scope=frontend|backend|all (default all)"
    vars:
      scope: '{{.scope | default "all"}}'
    requires:
      vars:
        - name: scope
          enum: [frontend, backend, all]
    cmds:
      - uv run pre-commit run shared --all-files --show-diff-on-failure
      - task: pre-commit:frontend
        if: '[ "{{.scope}}" != backend ]'
      - task: pre-commit:backend
        if: '[ "{{.scope}}" != frontend ]'

  pre-pr:
    desc: "Gate: is my change logically correct? (local, no services: unit, architecture, contract) scope=frontend|backend|all (default all)"
    vars:
      scope: '{{.scope | default "all"}}'
    requires:
      vars:
        - name: scope
          enum: [frontend, backend, all]
    cmds:
      - task: pre-commit
        vars:
          scope: '{{.scope}}'
      - task: pre-pr:scripts:unit-test
      - task: pre-pr:frontend
        if: '[ "{{.scope}}" != backend ]'
      - task: pre-pr:backend
        if: '[ "{{.scope}}" != frontend ]'
      - task: pre-pr:contract-test

  pre-merge:
    desc: "Gate: will main still work after this merge? (merge queue candidate on an ephemeral platform) scope=frontend|backend|all (default all)"
    vars:
      scope: '{{.scope | default "all"}}'
    requires:
      vars:
        - name: scope
          enum: [frontend, backend, all]
    cmds:
      - task: pre-pr
        vars:
          scope: '{{.scope}}'
      - task: pre-merge:frontend
        if: '[ "{{.scope}}" != backend ]'
      - task: pre-merge:backend
        if: '[ "{{.scope}}" != frontend ]'
      - task: pre-merge:api-test
      - task: pre-merge:e2e-critical-test

  post-merge:
    desc: "Gate: is main healthy once deployed to the shared environment? (staging, same artifacts as pre-merge)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: deployment-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
      - task: post-merge:smoke-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'

  pre-release:
    desc: "Gate: can this exact build go to production? (production-like environment, production-scale data)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: deployment-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
      - task: pre-release:migration-test
      - task: pre-release:rollback-test
      - task: pre-release:performance-critical-test

  deployment-test:
    summary: "Deploy the build-test images to KUBE_CONTEXT and verify the rollout (post-merge on staging, pre-release on a production-like cluster)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - cmd: echo "TODO:// deploy the build-test image tags to {{.KUBE_CONTEXT}}, assert the images are on the node, the rollout finished and no pod restarted"

  release:
    desc: "Gate: does the release hold under real traffic? (production canary, automatic rollback)"
    cmds:
      - task: release:canary-test

  nightly:
    desc: "Gate: are there problems that only show over time? (staging, scheduled)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: nightly:e2e-full-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
      - task: nightly:soak-test
      - task: nightly:resilience-test
      - task: nightly:performance-full-test
      - task: nightly:dependency-test

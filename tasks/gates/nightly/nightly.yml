# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  apps:
    taskfile: ../../apps.yml
    dir: ../../..
    internal: true
  backend:
    taskfile: ../../../src/data-platform/backend/Taskfile.yml
    dir: ../../../src/data-platform/backend
    internal: true
  chart:
    taskfile: ../../../platform/25-lakehouse-control-plane/Taskfile.yml
    dir: ../../../platform/25-lakehouse-control-plane
    internal: true

tasks:
  e2e-full-test:
    summary: "Run the full lakehouse control plane end-to-end test on the cluster"
    requires:
      vars:
        - name: KUBE_CONTEXT
    dir: '{{.ROOT_DIR}}'
    cmds:
      - defer:
          task: apps:deploy-lakehouse-control-plane
          vars:
            KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
            SETTINGS_PROFILE: default
      - task: apps:deploy-lakehouse-control-plane
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
          SETTINGS_PROFILE: e2e
      - KUBE_CONTEXT={{.KUBE_CONTEXT}} bash platform/25-lakehouse-control-plane/e2e/run.sh full

  soak-test:
    summary: "Run the platform under steady load for hours and watch for leaks"
    cmds:
      - cmd: echo "TODO:// keep CDC and maintenance running for hours, assert memory stays flat and no pod restarts"

  resilience-test:
    summary: "Check recovery from dependency outages"
    cmds:
      - cmd: echo "TODO:// kill Kafka, RustFS, Polaris, Temporal or the backend DB mid-run and assert the run recovers"

  performance-full-test:
    summary: "Run the full performance suite and track the trend over time (does not block)"
    cmds:
      - cmd: echo "TODO:// longer load on maintenance, catalog API and console bundle size, compared with previous nights"

  mutation-test:
    summary: "Run mutmut over the whole backend except the workflows, then mutate the wave-25 chart, and list the survivors"
    cmds:
      - task: backend:mutation-test
        vars:
          MUTANTS: '*'
      - task: chart:mutation-test

  dependency-test:
    summary: "Check compatibility with newer dependencies"
    cmds:
      - cmd: echo "TODO:// uv lock --upgrade and npm update in a scratch copy, then run the unit tests"

# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
  design-system:
    taskfile: ../../../src/design-system/Taskfile.yml
    dir: ../../../src/design-system
    internal: true
  console:
    taskfile: ../../../src/data-platform/frontend/Taskfile.yml
    dir: ../../../src/data-platform/frontend
    internal: true
  backend:
    taskfile: ../../../src/data-platform/backend/Taskfile.yml
    dir: ../../../src/data-platform/backend
    internal: true
  spark:
    taskfile: ../../../src/data-platform/runtime/spark/Taskfile.yml
    dir: ../../../src/data-platform/runtime/spark
    internal: true

tasks:
  frontend:
    desc: "Scan, measure coverage of and build the design system and the console"
    cmds:
      - task: design-system:security-test
      - task: console:security-test
      - task: design-system:coverage-test
      - task: console:coverage-test
      - task: console:build-test

  backend:
    desc: "Scan, measure coverage of, integration-test and build the backend and the Spark runtime"
    cmds:
      - task: backend:security-test
      - task: spark:security-test
      - task: backend:coverage-test
      - task: backend:integration-test
      - task: backend:build-test
      - task: spark:build-test

  api-test:
    summary: "Run the Bruno API collection against a running backend"
    cmds:
      - cmd: echo "TODO:// bru run the API collection against the ephemeral platform, secrets passed with --env-var"

  e2e-critical-test:
    summary: "Run the critical-path end-to-end test in minutes on an ephemeral platform"
    cmds:
      - cmd: echo "TODO:// provision an ephemeral platform from the build-test images; catalog round trip, create a table, write rows, trigger one maintenance run, read it back through Trino; tear it down"

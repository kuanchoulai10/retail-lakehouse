# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  sync:
    desc: "Sync local dev environment with repo state"
    cmds:
      - task: install-node-deps
      - task: install-playwright
      - task: install-python-deps
      - task: install-pre-commit-hook

  install-node-deps:
    desc: "Install Node workspace dependencies"
    internal: true
    cmds:
      - npm clean-install

  install-playwright:
    desc: "Install the Playwright Chromium browser for story tests"
    internal: true
    cmds:
      - npx --prefix src/design-system playwright install chromium

  install-python-deps:
    desc: "Install Python dependencies"
    internal: true
    cmds:
      - uv sync --locked --all-packages

  install-pre-commit-hook:
    desc: "Install pre-commit git hook"
    internal: true
    cmds:
      - uv run pre-commit install

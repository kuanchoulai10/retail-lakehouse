# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  pre-commit:
    desc: "Gate: is the code clean? (before a commit: lint, format, type) scope=frontend|backend|all (default all)"
    vars:
      scope: '{{.scope | default "all"}}'
    requires:
      vars:
        - name: scope
          enum: [frontend, backend, all]
    cmds:
      - uv run pre-commit run shared --all-files --show-diff-on-failure
      - task: pre-commit-frontend
        if: '[ "{{.scope}}" != backend ]'
      - task: pre-commit-backend
        if: '[ "{{.scope}}" != frontend ]'

  pre-commit-frontend:
    desc: "Lint and type-check the console and the design system (pre-commit hooks aliased frontend)"
    cmds:
      - uv run pre-commit run frontend --all-files --show-diff-on-failure

  pre-commit-backend:
    desc: "Lint, format and type-check the Python code (pre-commit hooks aliased backend)"
    cmds:
      - uv run pre-commit run backend --all-files --show-diff-on-failure

  pre-pr:
    desc: "Gate: is my change logically correct? (local, no services: unit, architecture, contract) scope=frontend|backend|all (default all)"
    vars:
      scope: '{{.scope | default "all"}}'
    requires:
      vars:
        - name: scope
          enum: [frontend, backend, all]
    cmds:
      - task: pre-commit
        vars:
          scope: '{{.scope}}'
      - task: unit-test-scripts
      - task: pre-pr-frontend
        if: '[ "{{.scope}}" != backend ]'
      - task: pre-pr-backend
        if: '[ "{{.scope}}" != frontend ]'
      - task: contract-test

  pre-pr-frontend:
    desc: "Run the console and design-system unit tests and the story browser tests"
    deps:
      - unit-test-frontend
      - unit-test-design-system
    cmds:
      - task: component-test

  pre-pr-backend:
    desc: "Run the backend and Spark unit tests and the import-linter boundaries"
    deps:
      - unit-test-backend
      - unit-test-spark
    cmds:
      - task: arch-test

  pre-merge:
    desc: "Gate: will main still work after this merge? (merge queue candidate on an ephemeral platform) scope=frontend|backend|all (default all)"
    vars:
      scope: '{{.scope | default "all"}}'
    requires:
      vars:
        - name: scope
          enum: [frontend, backend, all]
    cmds:
      - task: pre-pr
        vars:
          scope: '{{.scope}}'
      - task: pre-merge-frontend
        if: '[ "{{.scope}}" != backend ]'
      - task: pre-merge-backend
        if: '[ "{{.scope}}" != frontend ]'
      - task: api-test
      - task: e2e-critical-test

  pre-merge-frontend:
    desc: "Scan, measure coverage of and build the console"
    cmds:
      - task: security-test-frontend
      - task: coverage-test-frontend
      - task: build-test-frontend

  pre-merge-backend:
    desc: "Scan, measure coverage of, integration-test and build the backend and Spark runtime"
    cmds:
      - task: security-test-backend
      - task: coverage-test-backend
      - task: integration-test
      - task: build-test-backend

  post-merge:
    desc: "Gate: is main healthy once deployed to the shared environment? (staging, same artifacts as pre-merge)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: deployment-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
      - task: smoke-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'

  pre-release:
    desc: "Gate: can this exact build go to production? (production-like environment, production-scale data)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: deployment-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
      - task: migration-test
      - task: rollback-test
      - task: performance-test

  release:
    desc: "Gate: does the release hold under real traffic? (production canary, automatic rollback)"
    cmds:
      - task: canary-test

  nightly:
    desc: "Gate: are there problems that only show over time? (staging, scheduled)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: e2e-full-test
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
      - task: soak-test
      - task: resilience-test
      - task: performance-test
      - task: dependency-test

  unit-test:
    desc: "Run all unit tests in parallel"
    deps:
      - unit-test-backend
      - unit-test-spark
      - unit-test-scripts
      - unit-test-frontend
      - unit-test-design-system

  unit-test-backend:
    desc: "Run data-platform backend tests (includes the pytest architecture tests)"
    cmds:
      - uv run --project src/data-platform/backend --directory src/data-platform/backend pytest -v

  unit-test-spark:
    desc: "Run spark runtime tests"
    cmds:
      - cmd: echo "TODO:// uv run --project src/data-platform/runtime/spark --directory src/data-platform/runtime/spark pytest -v"

  unit-test-scripts:
    desc: "Run repository script tests"
    cmds:
      - uv run --no-project --with pyyaml --with pytest pytest scripts/tests -v

  unit-test-frontend:
    desc: "Run console unit tests"
    cmds:
      - npm --prefix src/data-platform/frontend test -- --run

  unit-test-design-system:
    desc: "Run design-system unit tests"
    cmds:
      - npm --prefix src/design-system test -- --run

  component-test:
    desc: "Run the design-system stories as browser tests with axe"
    cmds:
      - npm --prefix src/design-system run test:stories

  arch-test:
    desc: "Run architecture boundary tests (import-linter)"
    cmds:
      - uv run --project src/data-platform/backend --directory src/data-platform/backend lint-imports

  contract-test:
    desc: "Check the contracts between components"
    cmds:
      - cmd: echo "TODO:// console api/catalogTypes.ts vs the backend openapi.json; backend Polaris adapters vs the Polaris 1.8 OpenAPI; backend SparkApplication manifest vs the Spark Operator CRD"

  security-test:
    desc: "Scan for vulnerable dependencies and insecure code"
    cmds:
      - task: security-test-frontend
      - task: security-test-backend

  security-test-frontend:
    desc: "Scan the console's dependencies and image"
    cmds:
      - cmd: echo "TODO:// npm audit for the console and the design system, image scan for console"

  security-test-backend:
    desc: "Scan the backend's and Spark runtime's dependencies and images"
    cmds:
      - cmd: echo "TODO:// pip-audit for backend and spark, image scan for table-maintenance-backend and table-maintenance-spark"

  coverage-test:
    desc: "Enforce test coverage thresholds"
    cmds:
      - task: coverage-test-frontend
      - task: coverage-test-backend

  coverage-test-frontend:
    desc: "Enforce the console's test coverage threshold"
    cmds:
      - cmd: echo "TODO:// vitest --coverage with a floor for the console and the design system"

  coverage-test-backend:
    desc: "Enforce the backend's test coverage threshold"
    cmds:
      - cmd: echo "TODO:// pytest --cov with a floor for the backend"

  integration-test:
    desc: "Run backend adapters against real dependencies"
    cmds:
      - cmd: echo "TODO:// catalog adapters vs a Polaris container, SQL repos vs PostgreSQL, Temporal workflows vs the Temporal test server"

  build-test:
    desc: "Build every deliverable once, tagged by commit, for every later gate to reuse"
    cmds:
      - task: build-test-frontend
      - task: build-test-backend

  build-test-frontend:
    desc: "Build the console once, tagged by commit"
    cmds:
      - npm --prefix src/data-platform/frontend run build
      - cmd: echo "TODO:// docker build console with the build.sh source tag and push it to the registry"

  build-test-backend:
    desc: "Build the backend and Spark runtime images once, tagged by commit"
    cmds:
      - cmd: echo "TODO:// docker build table-maintenance-backend and table-maintenance-spark with the build.sh source tags and push them to the registry"

  api-test:
    desc: "Run the Bruno API collection against a running backend"
    cmds:
      - cmd: echo "TODO:// bru run the API collection against the ephemeral platform, secrets passed with --env-var"

  e2e-critical-test:
    desc: "Run the critical-path end-to-end test in minutes on an ephemeral platform"
    cmds:
      - cmd: echo "TODO:// provision an ephemeral platform from the build-test images; catalog round trip, create a table, write rows, trigger one maintenance run, read it back through Trino; tear it down"

  e2e-full-test:
    desc: "Run the full lakehouse control plane end-to-end test on the cluster"

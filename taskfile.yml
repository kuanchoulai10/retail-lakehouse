# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

output:
  group:
    begin: '::group::{{.TASK}}'
    end: '::endgroup::'

vars:
  AVAILABLE_KUBE_CONTEXTS:
    sh: command -v kubectl >/dev/null 2>&1 && kubectl config get-contexts -o name || true

includes:
  dev:
    taskfile: ./tasks/dev.yml
    dir: '{{.ROOT_DIR}}'
  checks:
    taskfile: ./tasks/checks.yml
    dir: '{{.ROOT_DIR}}'
  cluster:
    taskfile: ./tasks/cluster.yml
    dir: '{{.ROOT_DIR}}'
    vars:
      AVAILABLE_KUBE_CONTEXTS: '{{.AVAILABLE_KUBE_CONTEXTS}}'
  apps:
    taskfile: ./tasks/apps.yml
    dir: '{{.ROOT_DIR}}'
  trino:
    taskfile: ./tasks/trino.yml
    dir: '{{.ROOT_DIR}}'
    vars:
      AVAILABLE_KUBE_CONTEXTS: '{{.AVAILABLE_KUBE_CONTEXTS}}'
  kafka-ui:
    taskfile: ./tasks/kafka-ui.yml
    dir: '{{.ROOT_DIR}}'
    vars:
      AVAILABLE_KUBE_CONTEXTS: '{{.AVAILABLE_KUBE_CONTEXTS}}'
  docs:
    taskfile: ./tasks/docs.yml
    dir: '{{.ROOT_DIR}}'

tasks:
  default:
    desc: Display available tasks
    cmds:
      - task --list
    silent: true

  pre-commit:
    desc: "Gate: is the code clean? scope=frontend|backend|all (default all)"
    cmds:
      - task: checks:pre-commit
        vars:
          scope: '{{.scope | default "all"}}'

  pre-pr:
    desc: "Gate: is my change logically correct? scope=frontend|backend|all (default all)"
    cmds:
      - task: checks:pre-pr
        vars:
          scope: '{{.scope | default "all"}}'

  pre-merge:
    desc: "Gate: will main still work after this merge? scope=frontend|backend|all (default all)"
    cmds:
      - task: checks:pre-merge
        vars:
          scope: '{{.scope | default "all"}}'

  post-merge:
    desc: "Gate: is main healthy once deployed to the shared environment?"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: checks:post-merge
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'

  pre-release:
    desc: "Gate: can this exact build go to production?"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: checks:pre-release
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'

  release:
    desc: "Gate: does the release hold under real traffic?"
    cmds:
      - task: checks:release

  nightly:
    desc: "Gate: are there problems that only show over time?"
    requires:
      vars:
        - name: KUBE_CONTEXT
    cmds:
      - task: checks:nightly
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'

  unit-test:
    desc: "Run all unit tests in parallel"
    cmds:
      - task: checks:unit-test

  serve-docs:
    desc: Serve docs locally
    cmds:
      - task: docs:serve

  onboard:
    desc: "One-shot setup: check tools, bootstrap cluster + apps, sync dev"
    preconditions:
      - sh: '[ "$(uname -s)" = "Darwin" ]'
        msg: "Only macOS (Darwin) is supported right now, sorry"
      - sh: command -v colima
        msg: "colima missing, run: brew install colima"
      - sh: command -v docker
        msg: "docker missing, run: brew install docker"
      - sh: command -v minikube
        msg: "minikube missing, run: brew install minikube"
      - sh: command -v kubectl
        msg: "kubectl missing, run: brew install kubectl"
      - sh: command -v helm
        msg: "helm missing, run: brew install helm"
      - sh: command -v git
        msg: "git missing, run: xcode-select --install (or brew install git)"
      - sh: command -v python3
        msg: "python3 missing, run: xcode-select --install (or brew install python@3.13)"
      - sh: command -v jsonnet
        msg: "jsonnet missing, run: brew install jsonnet"
      - sh: command -v jb
        msg: "jb missing, run: brew install jsonnet-bundler"
      - sh: command -v envsubst
        msg: "envsubst missing, run: brew install gettext"
      - sh: command -v keytool
        msg: "keytool missing, run: brew install openjdk@21 (or any JDK)"
      - sh: command -v trino
        msg: "trino CLI missing, see: https://trino.io/docs/current/client/cli.html (or brew install trino)"
      - sh: command -v npm
        msg: "npm missing, run: brew install node"
      - sh: command -v uv
        msg: "uv missing, run: brew install uv"
    requires:
      vars:
        - name: KUBE_CONTEXT
        - name: DEPLOY_METHOD
          enum: ["scripts", "argocd"]
    vars:
      CPU: '{{.CPU | default 9}}'
      MEMORY: '{{.MEMORY | default 28}}'
      DISK_SIZE: '{{.DISK_SIZE | default 120}}'
    cmds:
      - task: cluster:bootstrap
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
          CPU: '{{.CPU}}'
          MEMORY: '{{.MEMORY}}'
          DISK_SIZE: '{{.DISK_SIZE}}'
      - task: apps:bootstrap-by-{{.DEPLOY_METHOD}}
        vars:
          KUBE_CONTEXT: '{{.KUBE_CONTEXT}}'
      - task: dev:sync
    prompt: |
      This will take 10-20 minutes and does the following:
      - Bootstrap a colima VM named '{{.KUBE_CONTEXT}}' ({{.CPU}} CPU, {{.MEMORY}}G RAM, {{.DISK_SIZE}}G disk)
      - Bootstrap up a minikube K8s cluster named '{{.KUBE_CONTEXT}}'
      - Bootstrap all K8s apps to the cluster via '{{.DEPLOY_METHOD}}'
      - Sets up your local dev environment (Python, Node, pre-commit hooks)

      Continue?

  offboard:
    desc: "Tear down: delete minikube cluster and colima VM (no-op if absent)"
    requires:
      vars:
        - name: KUBE_CONTEXT
    preconditions:
      - sh: command -v minikube
        msg: "minikube missing, run: brew install minikube"
      - sh: command -v colima
        msg: "colima missing, run: brew install colima"
    cmds:
      - minikube delete -p {{.KUBE_CONTEXT}}
      - colima delete -p {{.KUBE_CONTEXT}} -f
      - LIMA_HOME=$HOME/.colima/_lima limactl disk delete colima-{{.KUBE_CONTEXT}} 2>/dev/null || true
    prompt: |
      This will permanently delete the colima VM '{{.KUBE_CONTEXT}}' and
      everything inside it (minikube cluster, container images, volumes).
      It will also delete the lima additionalDisk that backs docker storage
      (colima delete leaves it behind, which makes minikube re-use stale
      kubelet/etcd state from the previous run and skip kubeadm init).

      Continue?

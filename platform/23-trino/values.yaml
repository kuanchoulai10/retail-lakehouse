# --8<-- [start:image]
image:
  tag: "476"
# --8<-- [end:image]

# --8<-- [start:server]
server:
  workers: 1
  config:
    authenticationType: "certificate,oauth2"
    query:
      maxMemory: "3GB"
  autoscaling:
    enabled: false
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 2
    pollingInterval: 15
    initialCooldownPeriod: 0 # default 0s
    cooldownPeriod: 300 # default 300s, only applies when scaling to 0
    fallback:
      failureThreshold: 3
      replicas: 1
      behavior: "static"
    advanced:
      horizontalPodAutoscalerConfig:
        behavior:
          scaleUp:
            stabilizationWindowSeconds: 0
            selectPolicy: Max
            policies:
              - type: Percent
                value: 100
                periodSeconds: 120
              - type: Pods
                value: 5
                periodSeconds: 60
          scaleDown:
            stabilizationWindowSeconds: 300
            selectPolicy: Min
            policies:
              - type: Pods
                value: 1
                periodSeconds: 60
    triggers:
      - type: prometheus
        metadata:
          serverAddress: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: sum(trino_execution_QueryManager_RunningQueries{namespace="lakehouse-query-engine",job="trino"})
          threshold: "2"
    annotations: {}
  coordinatorExtraConfig: |-
    http-server.https.enabled=true
    http-server.https.port=8443
    http-server.https.keystore.path=/etc/trino/tls/keystore.p12
    http-server.https.keystore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
    http-server.https.truststore.path=/etc/trino/truststore/truststore.p12
    http-server.https.truststore.key=${ENV:TRINO_KEYSTORE_PASSWORD}
    http-server.authentication.certificate.user-mapping.pattern=CN=([^,]+).*
    http-server.process-forwarded=true
    web-ui.authentication.type=oauth2
    http-server.authentication.oauth2.issuer=${ENV:PUBLIC_ORIGIN}/keycloak/realms/retail-lakehouse
    http-server.authentication.oauth2.auth-url=${ENV:PUBLIC_ORIGIN}/keycloak/realms/retail-lakehouse/protocol/openid-connect/auth
    http-server.authentication.oauth2.token-url=http://keycloak.identity.svc.cluster.local:8080/keycloak/realms/retail-lakehouse/protocol/openid-connect/token
    http-server.authentication.oauth2.jwks-url=http://keycloak.identity.svc.cluster.local:8080/keycloak/realms/retail-lakehouse/protocol/openid-connect/certs
    http-server.authentication.oauth2.oidc.discovery=false
    http-server.authentication.oauth2.client-id=trino
    http-server.authentication.oauth2.client-secret=${ENV:TRINO_OAUTH2_CLIENT_SECRET}
    http-server.authentication.oauth2.principal-field=preferred_username
    http-server.authentication.oauth2.scopes=openid
  exchangeManager:
    name: filesystem
    baseDir:
      - s3://trino-fault-tolerance-nkm5
      - s3://trino-fault-tolerance-cws0
# --8<-- [end:server]

# --8<-- [start:additionalProperties]
additionalConfigProperties:
  - internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
  - retry-policy=TASK
  - tracing.enabled=true
  - tracing.exporter.endpoint=http://jaeger-collector.lakehouse-query-engine.svc.cluster.local:4317

additionalExchangeManagerProperties:
  - exchange.s3.region=dummy-region
  - exchange.s3.endpoint=http://rustfs.object-storage.svc.cluster.local:9000
  - exchange.s3.aws-access-key=${ENV:TRINO_EXCHANGE_S3_ACCESS_KEY}
  - exchange.s3.aws-secret-key=${ENV:TRINO_EXCHANGE_S3_SECRET_KEY}
  - exchange.s3.path-style-access=true
# --8<-- [end:additionalProperties]

# --8<-- [start:env]
env:
  - name: PUBLIC_ORIGIN
    valueFrom:
      configMapKeyRef:
        name: trino-public-origin
        key: origin
  - name: TRINO_KEYSTORE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: trino-keystore-password
        key: password
  - name: TRINO_SHARED_SECRET
    valueFrom:
      secretKeyRef:
        name: trino-internal-shared-secret
        key: shared-secret
  - name: TRINO_POLARIS_CREDENTIAL
    valueFrom:
      secretKeyRef:
        name: trino-credentials
        key: polaris-credential
  - name: TRINO_EXCHANGE_S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: trino-credentials
        key: exchange-s3-access-key
  - name: TRINO_EXCHANGE_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: trino-credentials
        key: exchange-s3-secret-key
  - name: TRINO_OAUTH2_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: trino-credentials
        key: oauth2-client-secret
# --8<-- [end:env]

# --8<-- [start:initContainers]
initContainers:
  coordinator:
    - name: build-truststore
      image: eclipse-temurin:21-jre
      command:
        - sh
        - -c
        - |
          keytool -importcert -noprompt \
            -alias trino-ca \
            -file /tls-src/ca.crt \
            -keystore /tls-built/truststore.p12 \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD"
      env:
        - name: KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: trino-keystore-password
              key: password
      volumeMounts:
        - name: tls-certs
          mountPath: /tls-src
          readOnly: true
        - name: tls-built
          mountPath: /tls-built
# --8<-- [end:initContainers]

# --8<-- [start:resource-groups]
resourceGroups:
  type: configmap
  # Resource groups file is mounted to /etc/trino/resource-groups/resource-groups.json
  resourceGroupsConfig: |-
      {
        "rootGroups": [
          {
            "name": "global",
            "hardConcurrencyLimit": 10,
            "maxQueued": 100,
            "schedulingPolicy": "fair",
            "jmxExport": true
          }
        ],
        "selectors": [
          {
            "group": "global"
          }
        ]
      }

# --8<-- [end:resource-groups]

# --8<-- [start:coordinator]
coordinator:
  jvm:
    maxHeapSize: "2G"
  config:
    memory:
      heapHeadroomPerNode: "600MB"
    query:
      maxMemoryPerNode: "1GB"
  resources:
    requests:
      cpu: 250m
      memory: 2816Mi
    limits:
      memory: 2816Mi
  livenessProbe:
    initialDelaySeconds: 30
    failureThreshold: 20
  readinessProbe:
    initialDelaySeconds: 30
    failureThreshold: 20
  additionalVolumes:
    - name: tls-certs
      secret:
        secretName: trino-tls-secret
    - name: tls-built
      emptyDir: {}
  additionalVolumeMounts:
    - name: tls-certs
      mountPath: /etc/trino/tls
      readOnly: true
    - name: tls-built
      mountPath: /etc/trino/truststore
      readOnly: true
  annotations:
    checksum/trino-env: '{{ list (lookup "v1" "ConfigMap" .Release.Namespace "trino-public-origin").data (lookup "v1" "Secret" .Release.Namespace "trino-keystore-password").data (lookup "v1" "Secret" .Release.Namespace "trino-internal-shared-secret").data (lookup "v1" "Secret" .Release.Namespace "trino-credentials").data | toJson | sha256sum }}'
  additionalExposedPorts:
    https:
      servicePort: 8443
      name: https
      port: 8443
      protocol: TCP
  additionalJVMConfig:
    - --sun-misc-unsafe-memory-access=allow
  # additionalConfigFiles:
  #   http-event-listener.properties: |
  #     event-listener.name=http
  #     http-event-listener.log-created=true
  #     http-event-listener.log-completed=true
  #     http-event-listener.connect-ingest-uri=<your ingest URI>
  # access-control.properties: |
  #   access-control.name=file
  #   security.refresh-period=150s
  #   security.config-file=/etc/trino/access-control/rules.json
# --8<-- [end:coordinator]



# --8<-- [start:worker]
worker:
  annotations:
    checksum/trino-env: '{{ list (lookup "v1" "ConfigMap" .Release.Namespace "trino-public-origin").data (lookup "v1" "Secret" .Release.Namespace "trino-keystore-password").data (lookup "v1" "Secret" .Release.Namespace "trino-internal-shared-secret").data (lookup "v1" "Secret" .Release.Namespace "trino-credentials").data | toJson | sha256sum }}'
  jvm:
    maxHeapSize: "3G"
  config:
    memory:
      heapHeadroomPerNode: "900MB"
    query:
      maxMemoryPerNode: "1536MB"
  resources:
    requests:
      cpu: 250m
      memory: 4Gi
    limits:
      memory: 5Gi
  livenessProbe:
    initialDelaySeconds: 30
    failureThreshold: 20
  readinessProbe:
    initialDelaySeconds: 30
    failureThreshold: 20
  additionalJVMConfig:
    - --sun-misc-unsafe-memory-access=allow
  # additionalConfigFiles:
  #   http-event-listener.properties: |
  #     event-listener.name=http
  #     http-event-listener.log-created=true
  #     http-event-listener.log-completed=true
  #     http-event-listener.connect-ingest-uri=<your ingest URI>
# --8<-- [end:worker]

# --8<-- [start:jmx]
jmx:
  enabled: true
  exporter:
    enabled: true
    image: bitnami/jmx-exporter@sha256:c753bc2da381f9f01e0646c7ae9e7cdb8bd3298355e906952f5337be886d83bf
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        memory: 384Mi
    configProperties: |-
      hostPort: localhost:{{- .Values.jmx.registryPort }}
      startDelaySeconds: 0
      ssl: false
      lowercaseOutputName: false
      lowercaseOutputLabelNames: false
# --8<-- [end:jmx]

# --8<-- [start:serviceMonitor]
serviceMonitor:
  enabled: true
  labels:
    prometheus: kube-prometheus
  interval: "30s"
# --8<-- [end:serviceMonitor]

# --8<-- [start:catalogs]
catalogs:
  faker: |
    connector.name=faker
    faker.null-probability=0.1
    faker.default-limit=1000
    faker.locale=en
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://polaris.lakehouse-catalog.svc.cluster.local:8181/api/catalog
    iceberg.rest-catalog.warehouse=iceberg
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=${ENV:TRINO_POLARIS_CREDENTIAL}
    iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
    iceberg.rest-catalog.vended-credentials-enabled=true
    fs.native-s3.enabled=true
    s3.region=dummy-region
    s3.path-style-access=true
    s3.endpoint=http://rustfs.object-storage.svc.cluster.local:9000

# https://trino.io/docs/current/connector/iceberg.html#authorization
# https://trino.io/docs/current/object-storage/file-system-s3.html
# --8<-- [end:catalogs]

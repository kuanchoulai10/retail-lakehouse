{{- if .Values.worker.enabled }}
{{- $labels := dict "root" . "role" .Values.worker "component" "worker" "version" (include "table-maintenance.imageTag" (dict "root" . "image" .Values.image.backend)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "table-maintenance.worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- include "table-maintenance.workloadMetadata" $labels | nindent 2 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "table-maintenance.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      {{- include "table-maintenance.podMetadata" (merge (dict "checksum" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum)) $labels) | nindent 6 }}
    spec:
      serviceAccountName: {{ include "table-maintenance.worker.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- include "table-maintenance.podSecurity" . | nindent 6 }}
      {{- include "table-maintenance.podScheduling" (dict "root" . "role" .Values.worker) | nindent 6 }}
      initContainers:
        {{- include "table-maintenance.waitForSchema" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "table-maintenance.image" (dict "root" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "table-maintenance.env" (dict "root" . "role" .Values.worker "own" (include "table-maintenance.worker.env" .)) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "table-maintenance.config.fullname" . }}
            - secretRef:
                name: {{ .Values.secrets.s3 }}
            {{- include "table-maintenance.extraEnvFrom" (dict "root" . "role" .Values.worker) | nindent 12 }}
          {{- with include "table-maintenance.secretVolumeMounts" (dict "root" . "role" .Values.worker) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      {{- with include "table-maintenance.secretVolumes" (dict "root" . "role" .Values.worker) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
{{- end }}

{{- $labels := dict "root" . "role" .Values.backend.worker "component" "worker" "version" (include "table-maintenance.imageTag" (dict "root" . "image" .Values.backend.image)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "table-maintenance.worker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- include "table-maintenance.workloadMetadata" $labels | nindent 2 }}
spec:
  replicas: {{ .Values.backend.worker.replicas }}
  selector:
    matchLabels:
      {{- include "table-maintenance.selectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      {{- include "table-maintenance.podMetadata" (merge (dict "checksum" (include "table-maintenance.roleConfig" (dict "root" . "role" "worker") | sha256sum)) $labels) | nindent 6 }}
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "table-maintenance.worker.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.backend.worker.terminationGracePeriodSeconds }}
      {{- include "table-maintenance.podSecurity" . | nindent 6 }}
      {{- include "table-maintenance.podScheduling" (dict "root" . "role" .Values.backend.worker) | nindent 6 }}
      initContainers:
        {{- include "table-maintenance.waitForSchema" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "table-maintenance.image" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            {{- include "table-maintenance.roleArgs" (dict "role" "worker") | nindent 12 }}
          env:
            {{- include "table-maintenance.env" (dict "root" . "role" .Values.backend.worker "own" (include "table-maintenance.worker.env" .)) | nindent 12 }}
          envFrom:
            {{- include "table-maintenance.s3EnvFrom" . | nindent 12 }}
            {{- include "table-maintenance.extraEnvFrom" (dict "root" . "role" .Values.backend.worker) | nindent 12 }}
          volumeMounts:
            {{- include "table-maintenance.configVolumeMount" . | nindent 12 }}
            {{- with include "table-maintenance.secretVolumeMounts" (dict "root" . "role" .Values.backend.worker) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.backend.worker.resources | nindent 12 }}
      volumes:
        {{- include "table-maintenance.configVolume" (dict "root" . "role" "worker") | nindent 8 }}
        {{- include "table-maintenance.waitForSchemaVolume" . | nindent 8 }}
        {{- with include "table-maintenance.secretVolumes" (dict "root" . "role" .Values.backend.worker) }}
        {{- . | nindent 8 }}
        {{- end }}

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: table-maintenance-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" . | nindent 4 }}
    app: table-maintenance-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-maintenance-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" . | nindent 4 }}
    app: table-maintenance-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: table-maintenance-db
  template:
    metadata:
      labels:
        app: table-maintenance-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.secretName }}
                  key: {{ .Values.postgres.secretKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: table-maintenance-db
---
apiVersion: v1
kind: Service
metadata:
  name: table-maintenance-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" . | nindent 4 }}
    app: table-maintenance-db
spec:
  selector:
    app: table-maintenance-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%d" (include "table-maintenance.migrate.fullname" .) (int .Release.Revision) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "migrate" "version" (include "table-maintenance.imageTag" (dict "root" . "image" .Values.image.backend))) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "table-maintenance.labels" (dict "root" . "component" "migrate" "version" (include "table-maintenance.imageTag" (dict "root" . "image" .Values.image.backend))) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "table-maintenance.podSecurity" . | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h table-maintenance-db -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}; do sleep 2; done
      containers:
        - name: migrate
          image: {{ include "table-maintenance.image" (dict "root" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GLAC_COMPONENT
              value: migrate
            {{- include "table-maintenance.dbEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "table-maintenance.config.fullname" . }}
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}

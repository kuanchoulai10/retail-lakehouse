apiVersion: batch/v1
kind: Job
metadata:
  name: table-maintenance-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "name" "table-maintenance" "component" "migrate" "version" .Values.image.backend.tag) | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "table-maintenance.labels" (dict "root" . "name" "table-maintenance" "component" "migrate" "version" .Values.image.backend.tag) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      {{- include "table-maintenance.podSecurity" . | nindent 6 }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until pg_isready -h table-maintenance-db -U {{ .Values.postgres.user }} -d {{ .Values.postgres.database }}; do sleep 2; done
      containers:
        - name: migrate
          image: {{ include "table-maintenance.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GLAC_COMPONENT
              value: migrate
            {{- include "table-maintenance.dbEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: table-maintenance-config
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}

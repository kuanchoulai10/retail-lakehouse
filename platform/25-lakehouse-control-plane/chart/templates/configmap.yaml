{{- range $role := splitList " " (include "table-maintenance.backendRoles" .) }}
{{- $context := dict "root" $ "role" $role }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "table-maintenance.roleConfig.fullname" $context }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" $ "component" "config") | nindent 4 }}
data:
  config.yaml: |
    {{- include "table-maintenance.roleConfig" $context | nindent 4 }}
{{- end }}

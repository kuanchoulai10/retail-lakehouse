{{- if .Values.console.enabled }}
{{- $labels := dict "root" . "role" .Values.console "component" "ui" "version" (include "table-maintenance.imageTag" (dict "root" . "image" .Values.image.console)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "table-maintenance.console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- include "table-maintenance.workloadMetadata" $labels | nindent 2 }}
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      {{- include "table-maintenance.selectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      {{- include "table-maintenance.podMetadata" $labels | nindent 6 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- include "table-maintenance.podScheduling" (dict "root" . "role" .Values.console) | nindent 6 }}
      containers:
        - name: console
          image: {{ include "table-maintenance.image" (dict "root" . "image" .Values.image.console) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "table-maintenance.env" (dict "root" . "role" .Values.console "own" (include "table-maintenance.console.env" .)) | nindent 12 }}
          {{- with include "table-maintenance.extraEnvFrom" (dict "root" . "role" .Values.console) }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
          readinessProbe:
            httpGet:
              path: /console/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /console/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- with include "table-maintenance.secretVolumeMounts" (dict "root" . "role" .Values.console) }}
          volumeMounts:
            {{- . | nindent 12 }}
          {{- end }}
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
      {{- with include "table-maintenance.secretVolumes" (dict "root" . "role" .Values.console) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "table-maintenance.console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  selector:
    {{- include "table-maintenance.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.console.port }}
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "table-maintenance.console.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.console.gateway.name }}
      namespace: {{ .Values.console.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /console
      backendRefs:
        - name: {{ include "table-maintenance.console.fullname" . }}
          port: {{ .Values.console.port }}
{{- end }}

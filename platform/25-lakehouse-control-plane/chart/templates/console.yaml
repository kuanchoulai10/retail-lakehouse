apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "name" "console" "component" "ui" "version" .Values.image.console.tag) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "table-maintenance.selectorLabels" (dict "root" . "name" "console" "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "table-maintenance.labels" (dict "root" . "name" "console" "component" "ui" "version" .Values.image.console.tag) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: {{ include "table-maintenance.consoleImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.console.port }}
          readinessProbe:
            httpGet:
              path: /console/
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /console/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "name" "console" "component" "ui") | nindent 4 }}
spec:
  selector:
    {{- include "table-maintenance.selectorLabels" (dict "root" . "name" "console" "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.console.port }}
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "name" "console" "component" "ui") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.console.gateway.name }}
      namespace: {{ .Values.console.gateway.namespace }}
  hostnames:
    - {{ .Values.console.hostname }}
  rules:
    - backendRefs:
        - name: console
          port: {{ .Values.console.port }}

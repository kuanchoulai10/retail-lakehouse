{{- if .Values.eventConsumer.enabled }}
{{- $labels := dict "root" . "role" .Values.eventConsumer "component" "event-consumer" "version" (include "table-maintenance.imageTag" (dict "root" . "image" .Values.image.backend)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "table-maintenance.eventConsumer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- include "table-maintenance.workloadMetadata" $labels | nindent 2 }}
spec:
  replicas: {{ .Values.eventConsumer.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "table-maintenance.selectorLabels" (dict "root" . "component" "event-consumer") | nindent 6 }}
  template:
    metadata:
      {{- include "table-maintenance.podMetadata" (merge (dict "checksum" (include "table-maintenance.roleConfig" (dict "root" . "role" "eventConsumer") | sha256sum)) $labels) | nindent 6 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      {{- include "table-maintenance.podSecurity" . | nindent 6 }}
      {{- include "table-maintenance.podScheduling" (dict "root" . "role" .Values.eventConsumer) | nindent 6 }}
      initContainers:
        {{- include "table-maintenance.waitForSchema" . | nindent 8 }}
      containers:
        - name: event-consumer
          image: {{ include "table-maintenance.image" (dict "root" . "image" .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- include "table-maintenance.roleArgs" (dict "root" . "role" "eventConsumer") | nindent 12 }}
          env:
            {{- include "table-maintenance.env" (dict "root" . "role" .Values.eventConsumer "own" (include "table-maintenance.eventConsumer.env" .)) | nindent 12 }}
          {{- with include "table-maintenance.extraEnvFrom" (dict "root" . "role" .Values.eventConsumer) | trim }}
          envFrom:
            {{- . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "table-maintenance.configVolumeMount" . | nindent 12 }}
            {{- with include "table-maintenance.secretVolumeMounts" (dict "root" . "role" .Values.eventConsumer) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.eventConsumer.resources | nindent 12 }}
      volumes:
        {{- include "table-maintenance.configVolume" (dict "root" . "role" "eventConsumer") | nindent 8 }}
        {{- include "table-maintenance.waitForSchemaVolume" . | nindent 8 }}
        {{- with include "table-maintenance.secretVolumes" (dict "root" . "role" .Values.eventConsumer) }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}

{{- if .Values.worker.enabled }}
{{- if .Values.worker.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "table-maintenance.worker.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "worker") | nindent 4 }}
  {{- with .Values.worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "table-maintenance.worker.fullname" . }}
  namespace: {{ .Values.namespaces.maintenanceOperations }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "worker") | nindent 4 }}
rules:
  - apiGroups: ["sparkoperator.k8s.io"]
    resources: ["sparkapplications"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "table-maintenance.worker.fullname" . }}
  namespace: {{ .Values.namespaces.maintenanceOperations }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "worker") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "table-maintenance.worker.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "table-maintenance.worker.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.spark.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "table-maintenance.spark.serviceAccountName" . }}
  namespace: {{ .Values.namespaces.maintenanceOperations }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "spark-job") | nindent 4 }}
  {{- with .Values.spark.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "table-maintenance.spark.serviceAccountName" . }}
  namespace: {{ .Values.namespaces.maintenanceOperations }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "spark-job") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "table-maintenance.spark.serviceAccountName" . }}
  namespace: {{ .Values.namespaces.maintenanceOperations }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "spark-job") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "table-maintenance.spark.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "table-maintenance.spark.serviceAccountName" . }}
    namespace: {{ .Values.namespaces.maintenanceOperations }}
{{- end }}

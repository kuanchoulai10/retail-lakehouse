{{- $labels := dict "root" . "role" .Values.backend.api "component" "api" "version" (include "table-maintenance.imageTag" (dict "root" . "image" .Values.backend.image)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "table-maintenance.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- include "table-maintenance.workloadMetadata" $labels | nindent 2 }}
spec:
  replicas: {{ .Values.backend.api.replicas }}
  selector:
    matchLabels:
      {{- include "table-maintenance.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      {{- include "table-maintenance.podMetadata" (merge (dict "checksum" (include "table-maintenance.roleConfig" (dict "root" . "role" "api") | sha256sum)) $labels) | nindent 6 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- include "table-maintenance.podSecurity" . | nindent 6 }}
      {{- include "table-maintenance.podScheduling" (dict "root" . "role" .Values.backend.api) | nindent 6 }}
      initContainers:
        {{- include "table-maintenance.waitForSchema" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "table-maintenance.image" (dict "root" . "image" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          args:
            {{- include "table-maintenance.roleArgs" (dict "root" . "role" "api") | nindent 12 }}
          env:
            {{- include "table-maintenance.env" (dict "root" . "role" .Values.backend.api "own" (include "table-maintenance.api.env" .)) | nindent 12 }}
          envFrom:
            {{- include "table-maintenance.s3EnvFrom" . | nindent 12 }}
            {{- include "table-maintenance.extraEnvFrom" (dict "root" . "role" .Values.backend.api) | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.api.port }}
          readinessProbe:
            {{- include "table-maintenance.httpProbe" .Values.backend.api.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- include "table-maintenance.httpProbe" .Values.backend.api.livenessProbe | nindent 12 }}
          volumeMounts:
            {{- include "table-maintenance.configVolumeMount" . | nindent 12 }}
            {{- with include "table-maintenance.secretVolumeMounts" (dict "root" . "role" .Values.backend.api) }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.backend.api.resources | nindent 12 }}
      volumes:
        {{- include "table-maintenance.configVolume" (dict "root" . "role" "api") | nindent 8 }}
        {{- include "table-maintenance.waitForSchemaVolume" . | nindent 8 }}
        {{- with include "table-maintenance.secretVolumes" (dict "root" . "role" .Values.backend.api) }}
        {{- . | nindent 8 }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "table-maintenance.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "table-maintenance.selectorLabels" (dict "root" . "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.api.port }}
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "table-maintenance.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.backend.api.httpRoute.gateway.name }}
      namespace: {{ .Values.backend.api.httpRoute.gateway.namespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.backend.api.rootPath }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "table-maintenance.api.fullname" . }}
          port: {{ .Values.backend.api.port }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-maintenance-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "name" "table-maintenance" "component" "api") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "table-maintenance.selectorLabels" (dict "root" . "name" "table-maintenance" "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "table-maintenance.labels" (dict "root" . "name" "table-maintenance" "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "table-maintenance.podSecurity" . | nindent 6 }}
      initContainers:
        {{- include "table-maintenance.waitForSchema" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "table-maintenance.backendImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GLAC_COMPONENT
              value: api
            {{- include "table-maintenance.appEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: table-maintenance-config
            - secretRef:
                name: {{ .Values.secrets.s3 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          {{- include "table-maintenance.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: table-maintenance-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "table-maintenance.labels" (dict "root" . "name" "table-maintenance" "component" "api") | nindent 4 }}
spec:
  selector:
    {{- include "table-maintenance.selectorLabels" (dict "root" . "name" "table-maintenance" "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http

image:
  backend:
    repository: table-maintenance-backend
    tag: ""
  spark:
    repository: table-maintenance-spark
    tag: ""
  console:
    repository: console
    tag: ""
  pullPolicy: IfNotPresent

postgres:
  image: postgres:17.11-alpine
  user: table_maintenance
  database: table_maintenance
  storage: 5Gi
  secretName: table-maintenance-db
  secretKey: password

secrets:
  catalogCredential: table-maintenance-polaris-credential
  s3: table-maintenance-s3

namespaces:
  controlPlane: lakehouse-control-plane
  maintenanceOperations: lakehouse-maintenance-operations

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: default

catalog:
  uri: http://polaris.lakehouse-catalog.svc.cluster.local:8181/api/catalog
  managementUri: http://polaris.lakehouse-catalog.svc.cluster.local:8181/api/management/v1
  scope: PRINCIPAL_ROLE:ALL
  names:
    - iceberg
  s3Endpoint: http://rustfs.object-storage.svc.cluster.local:9000
  s3PathStyleAccess: true
  s3Region: dummy-region

kafka:
  bootstrapServers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: polaris-catalog-events

spark:
  serviceAccount: table-maintenance-spark
  sparkVersion: 4.0.0
  icebergVersion: 1.10.1
  sizes:
    S:
      driverMemory: 768m
      executorMemory: 768m
      executorInstances: 1
    M:
      driverMemory: 1g
      executorMemory: 1536m
      executorInstances: 1
    L:
      driverMemory: 1536m
      executorMemory: 2g
      executorInstances: 1

api:
  port: 8000
  rootPath: /api
  gateway:
    name: platform-gateway
    namespace: istio-ingress
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

worker:
  admissionLimit: 2
  discoveryIntervalSeconds: 600
  attemptDeadlineSeconds: 21600
  terminationGracePeriodSeconds: 90
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

compaction:
  partitionsPerRun: 10
  minPartitionBytes: 0
  quietSeconds: 120
  maxQuietWaitSeconds: 3600
  benefitWeight: 0.7
  costWeight: 0.3
  benefitReferenceFiles: 100
  costReferenceGbHours: 1.0
  defaultThroughputBytesPerHour: 2147483648
  minThroughputSampleBytes: 67108864
  sizeSMaxBytes: 268435456
  sizeMMaxBytes: 1073741824

scheduler:
  roundSeconds: 120
  budgetGbHours: 0.05
  priorityWeights:
    P0: 4.0
    P1: 2.0
    P2: 1.0
  slaSeconds:
    P0: 3600
    P1: 14400
    P2: 28800
  grantLeaseSeconds: 600
  roundsKept: 500

eventConsumer:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

console:
  port: 8080
  gateway:
    name: platform-gateway
    namespace: istio-ingress
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

migrate:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

logLevel: INFO

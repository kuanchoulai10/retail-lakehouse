nameOverride: ""
fullnameOverride: ""
commonLabels: {}

imagePullSecrets: []

env: []
envFrom: []
secretMounts: []

extraManifests: []

image:
  registry: ""
  pullPolicy: IfNotPresent
  backend:
    repository: table-maintenance-backend
    tag: ""
    digest: ""
  spark:
    repository: table-maintenance-spark
    tag: ""
    digest: ""
  console:
    repository: console
    tag: ""
    digest: ""

database:
  host: table-maintenance-db
  port: 5432
  name: table_maintenance
  user: table_maintenance
  existingSecret: table-maintenance-db
  secretKey: password
  clientImage: postgres:17.11-alpine

secrets:
  catalogCredential: table-maintenance-polaris-credential
  s3: table-maintenance-s3

namespaces:
  maintenanceOperations: lakehouse-maintenance-operations

temporal:
  address: temporal-frontend.temporal.svc.cluster.local:7233
  namespace: default

catalog:
  uri: http://polaris.lakehouse-catalog.svc.cluster.local:8181/api/catalog
  managementUri: http://polaris.lakehouse-catalog.svc.cluster.local:8181/api/management/v1
  scope: PRINCIPAL_ROLE:ALL
  s3Endpoint: http://rustfs.object-storage.svc.cluster.local:9000
  s3PathStyleAccess: true
  s3Region: dummy-region

kafka:
  bootstrapServers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: polaris-catalog-events

spark:
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  sparkVersion: 4.0.0
  icebergVersion: 1.10.1
  sizes:
    S:
      driverMemory: 768m
      executorMemory: 768m
      executorInstances: 1
    M:
      driverMemory: 1g
      executorMemory: 1536m
      executorInstances: 1
    L:
      driverMemory: 1536m
      executorMemory: 2g
      executorInstances: 1

volcano:
  create: true
  queues:
    maintenance:
      name: ""
      capability:
        cpu: "2"
        memory: 5017Mi
    urgent:
      name: ""
      capability:
        cpu: "2"
        memory: 5017Mi
  priorityClassPrefix: ""
  priorities:
    P0: 1000003
    P1: 1000002
    P2: 1000001
    P3: 1000000

rbac:
  create: true

api:
  enabled: true
  replicas: 1
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []
  secretMounts: []
  port: 8000
  rootPath: /api
  gateway:
    name: platform-gateway
    namespace: istio-ingress
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

worker:
  enabled: true
  replicas: 1
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []
  secretMounts: []
  discoveryIntervalSeconds: 600
  attemptDeadlineSeconds: 21600
  maxAttempts: 3
  queueWaitLimitSeconds: 86400
  rewriteDataFilesCooldownSeconds: 3600
  rewriteManifestsCooldownSeconds: 21600
  expireSnapshotsCooldownSeconds: 21600
  removeOrphanFilesIntervalSeconds: 604800
  failureBackoffCapSeconds: 86400
  compactionPartitionsPerJob: 10
  compactionQuietSeconds: 120
  compactionMaxQuietWaitSeconds: 3600
  terminationGracePeriodSeconds: 90
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 1Gi

eventConsumer:
  enabled: true
  replicas: 1
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []
  secretMounts: []
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

console:
  enabled: true
  replicas: 1
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []
  secretMounts: []
  port: 8080
  gateway:
    name: platform-gateway
    namespace: istio-ingress
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi

migrate:
  enabled: true
  labels: {}
  annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  env: []
  envFrom: []
  secretMounts: []
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 512Mi

metrics:
  prometheusUrl: http://table-metrics-prometheus.table-metrics.svc.cluster.local:9090

settingsProfile: default

logLevel: INFO

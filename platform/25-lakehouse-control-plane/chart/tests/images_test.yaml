suite: images are registry, repository, tag or appVersion, and digest
templates:
  - templates/api.yaml
  - templates/configmap.yaml
  - templates/console.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
values:
  - ../ci/default-values.yaml
tests:
  - it: tag empty uses appVersion
    set:
      backend.image.tag: ""
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: "spec.template.spec.containers[0].image", value: "table-maintenance-backend:0.1.0"}
      - equal: {path: "spec.template.metadata.labels[\"app.kubernetes.io/version\"]", value: "0.1.0"}

  - it: registry and digest
    set:
      global.image.registry: reg.example
      backend.image.tag: "1.2"
      backend.image.digest: sha256:abc
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: "spec.template.spec.containers[0].image", value: "reg.example/table-maintenance-backend:1.2@sha256:abc"}

  - it: spark image reaches the worker config
    set:
      global.image.registry: reg.example
      maintenance.jobs.image.tag: ""
      maintenance.jobs.image.digest: sha256:def
    template: templates/configmap.yaml
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  image: reg\.example/table\-maintenance\-spark:0\.1\.0@sha256:def$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: console image follows the same rule
    set:
      frontend.image.tag: "2.0"
    template: templates/console.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: "spec.template.spec.containers[0].image", value: "console:2.0"}
      - equal: {path: "spec.template.metadata.labels[\"app.kubernetes.io/version\"]", value: "2.0"}

  - it: version label is the effective tag
    set:
      backend.image.tag: "1.2"
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: "spec.template.metadata.labels[\"app.kubernetes.io/version\"]", value: "1.2"}
      - equal: {path: "metadata.labels[\"app.kubernetes.io/version\"]", value: "1.2"}

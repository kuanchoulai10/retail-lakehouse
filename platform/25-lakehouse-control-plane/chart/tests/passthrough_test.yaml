suite: env, envFrom, secretMounts and extraManifests pass through at two layers
templates:
  - templates/api.yaml
  - templates/configmap.yaml
  - templates/worker.yaml
  - templates/console.yaml
  - templates/extra-manifests.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
values:
  - ../ci/default-values.yaml
tests:
  - it: global and role env both reach the pod, global first
    set:
      global.env: [{name: G, value: g}]
      backend.worker.env: [{name: W, value: w}]
    asserts:
      - lengthEqual: {path: "spec.template.spec.containers[0].env", count: 6}
        template: templates/worker.yaml
      - equal: {path: "spec.template.spec.containers[0].env[4]", value: {name: G, value: g}}
        template: templates/worker.yaml
      - equal: {path: "spec.template.spec.containers[0].env[5]", value: {name: W, value: w}}
        template: templates/worker.yaml
      - contains: {path: "spec.template.spec.containers[0].env", content: {name: G, value: g}}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - notContains: {path: "spec.template.spec.containers[0].env", content: {name: W, value: w}}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}

  - it: a name in both layers is one entry, and the role's value wins
    set:
      global.env: [{name: X, value: global}, {name: Y, value: "y"}]
      backend.api.env: [{name: X, value: role}]
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - lengthEqual: {path: "spec.template.spec.containers[0].env", count: 6}
      - equal: {path: "spec.template.spec.containers[0].env[4]", value: {name: X, value: role}}
      - equal: {path: "spec.template.spec.containers[0].env[5]", value: {name: Y, value: "y"}}

  - it: an entry named like one of the chart's own replaces it in place
    set:
      backend.api.env: [{name: GLAC_CATALOG__CREDENTIAL, value: "id:secret"}]
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - lengthEqual: {path: "spec.template.spec.containers[0].env", count: 4}
      - equal: {path: "spec.template.spec.containers[0].env[3]", value: {name: GLAC_CATALOG__CREDENTIAL, value: "id:secret"}}

  - it: a role env name the worker shares with the global layer is one entry on the worker too
    set:
      global.env: [{name: X, value: global}]
      backend.worker.env: [{name: X, value: role}]
      backend.migrate.env: [{name: X, value: migrate}]
    asserts:
      - lengthEqual: {path: "spec.template.spec.containers[0].env", count: 5}
        template: templates/worker.yaml
      - equal: {path: "spec.template.spec.containers[0].env[4]", value: {name: X, value: role}}
        template: templates/worker.yaml

  - it: envFrom layers follow the chart's own sources
    set:
      global.envFrom: [{secretRef: {name: global-extra}}]
      backend.api.envFrom: [{configMapRef: {name: api-extra}}]
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - lengthEqual: {path: "spec.template.spec.containers[0].envFrom", count: 3}
      - equal: {path: "spec.template.spec.containers[0].envFrom[1]", value: {secretRef: {name: global-extra}}}
      - equal: {path: "spec.template.spec.containers[0].envFrom[2]", value: {configMapRef: {name: api-extra}}}

  - it: env and envFrom reach the console too
    set:
      global.env: [{name: G, value: g}]
      frontend.console.envFrom: [{configMapRef: {name: console-extra}}]
    template: templates/console.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal:
          path: "spec.template.spec.containers[0].env"
          value:
            - {name: CONSOLE_PORT, value: "8080"}
            - {name: CONSOLE_API_UPSTREAM, value: "http://table-maintenance-api.lakehouse-control-plane.svc.cluster.local:8000"}
            - {name: G, value: g}
      - equal: {path: "spec.template.spec.containers[0].envFrom", value: [{configMapRef: {name: console-extra}}]}

  - it: secretMounts at both layers, with names that cannot collide
    set:
      global.secretMounts: [{name: ca, secretName: ca-bundle, path: /etc/ca}]
      backend.api.secretMounts:
        - {name: tls, secretName: api-tls, path: /etc/tls}
        - {name: ca, secretName: api-ca, path: /etc/api-ca}
    asserts:
      - equal:
          path: spec.template.spec.volumes
          value:
            - {name: config, configMap: {name: table-maintenance-api-config}}
            - {name: migrate-config, configMap: {name: table-maintenance-migrate-config}}
            - {name: secret-global-ca, secret: {secretName: ca-bundle}}
            - {name: secret-role-tls, secret: {secretName: api-tls}}
            - {name: secret-role-ca, secret: {secretName: api-ca}}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: "spec.template.spec.containers[0].volumeMounts"
          value:
            - {name: config, mountPath: /etc/glac, readOnly: true}
            - {name: secret-global-ca, mountPath: /etc/ca, readOnly: true}
            - {name: secret-role-tls, mountPath: /etc/tls, readOnly: true}
            - {name: secret-role-ca, mountPath: /etc/api-ca, readOnly: true}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal:
          path: spec.template.spec.volumes
          value:
            - {name: config, configMap: {name: table-maintenance-worker-config}}
            - {name: migrate-config, configMap: {name: table-maintenance-migrate-config}}
            - {name: secret-global-ca, secret: {secretName: ca-bundle}}
        template: templates/worker.yaml

  - it: no secretMounts leave only the settings file
    template: templates/worker.yaml
    asserts:
      - equal: {path: spec.template.spec.volumes, value: [{name: config, configMap: {name: table-maintenance-worker-config}}, {name: migrate-config, configMap: {name: table-maintenance-migrate-config}}]}
      - equal: {path: "spec.template.spec.containers[0].volumeMounts", value: [{name: config, mountPath: /etc/glac, readOnly: true}]}

  - it: extraManifests render with templating, as strings or objects
    set:
      extraManifests:
        - |
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ include "table-maintenance.fullname" . }}-extra
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-object"
    template: templates/extra-manifests.yaml
    asserts:
      - hasDocuments: {count: 2}
      - equal: {path: metadata.name, value: table-maintenance-extra}
        documentIndex: 0
      - equal: {path: metadata.name, value: table-maintenance-object}
        documentIndex: 1

  - it: no extraManifests render nothing
    template: templates/extra-manifests.yaml
    asserts:
      - hasDocuments: {count: 0}

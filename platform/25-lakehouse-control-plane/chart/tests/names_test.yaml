suite: names follow the release and every reference follows the names
templates:
  - templates/api.yaml
  - templates/console.yaml
  - templates/worker.yaml
  - templates/event-consumer.yaml
  - templates/migrate-job.yaml
  - templates/console.yaml
  - templates/configmap.yaml
  - templates/rbac.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
  revision: 1
values:
  - ../ci/default-values.yaml
tests:
  - it: default release keeps today's names
    asserts:
      - equal: {path: metadata.name, value: table-maintenance-api}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: metadata.name, value: table-maintenance-api}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Service}
      - equal: {path: metadata.name, value: table-maintenance-worker}
        template: templates/worker.yaml
      - equal: {path: metadata.name, value: table-maintenance-event-consumer}
        template: templates/event-consumer.yaml
      - equal: {path: metadata.name, value: table-maintenance-migrate-1}
        template: templates/migrate-job.yaml
      - equal: {path: metadata.name, value: table-maintenance-console}
        template: templates/console.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: metadata.name, value: table-maintenance-console}
        template: templates/console.yaml
        documentSelector: {path: kind, value: Service}
      - equal: {path: metadata.name, value: table-maintenance-worker-config}
        template: templates/configmap.yaml
        documentIndex: 1
      - equal: {path: metadata.name, value: table-maintenance-worker}
        template: templates/rbac.yaml
        documentIndex: 0

  - it: another release name renames everything and every reference
    release:
      name: tm2
    asserts:
      - equal: {path: metadata.name, value: tm2-table-maintenance-api}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: metadata.name, value: tm2-table-maintenance-api}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Service}
      - equal: {path: "spec.rules[0].backendRefs[0].name", value: tm2-table-maintenance-api}
        template: templates/api.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal: {path: metadata.name, value: tm2-table-maintenance-worker}
        template: templates/worker.yaml
      - equal: {path: spec.template.spec.serviceAccountName, value: tm2-table-maintenance-worker}
        template: templates/worker.yaml
      - equal: {path: metadata.name, value: tm2-table-maintenance-event-consumer}
        template: templates/event-consumer.yaml
      - equal: {path: metadata.name, value: tm2-table-maintenance-migrate-1}
        template: templates/migrate-job.yaml
      - equal: {path: metadata.name, value: tm2-table-maintenance-console}
        template: templates/console.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: "spec.rules[0].backendRefs[0].name", value: tm2-table-maintenance-console}
        template: templates/console.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal: {path: metadata.name, value: tm2-table-maintenance-worker-config}
        template: templates/configmap.yaml
        documentIndex: 1
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^callback_base_url: http://tm2\-table\-maintenance\-api\.lakehouse\-control\-plane\.svc\.cluster\.local:8000$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  service_account: tm2\-table\-maintenance\-spark$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
      - equal: {path: metadata.name, value: tm2-table-maintenance-worker}
        template: templates/rbac.yaml
        documentIndex: 0
      - equal: {path: "subjects[0].name", value: tm2-table-maintenance-worker}
        template: templates/rbac.yaml
        documentIndex: 2
      - equal: {path: metadata.name, value: tm2-table-maintenance-spark}
        template: templates/rbac.yaml
        documentIndex: 3
      - equal: {path: "subjects[0].name", value: tm2-table-maintenance-spark}
        template: templates/rbac.yaml
        documentIndex: 5
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: tm2-table-maintenance-api-config}}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: tm2-table-maintenance-worker-config}}
        template: templates/worker.yaml
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: tm2-table-maintenance-event-consumer-config}}
        template: templates/event-consumer.yaml
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: tm2-table-maintenance-migrate-config}}
        template: templates/migrate-job.yaml

  - it: the API port and name reach every reference to the API
    release:
      name: tm2
      namespace: other-ns
    set:
      backend.api.port: 9000
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^callback_base_url: http://tm2\-table\-maintenance\-api\.other\-ns\.svc\.cluster\.local:9000$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
      - equal: {path: "spec.rules[0].backendRefs[0].port", value: 9000}
        template: templates/api.yaml
        documentSelector: {path: kind, value: HTTPRoute}
      - equal: {path: "spec.ports[0].port", value: 9000}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Service}
      - equal: {path: "spec.template.spec.containers[0].ports[0].containerPort", value: 9000}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: "spec.template.spec.containers[0].env"
          content: {name: CONSOLE_API_UPSTREAM, value: "http://tm2-table-maintenance-api.other-ns.svc.cluster.local:9000"}
        template: templates/console.yaml
        documentSelector: {path: kind, value: Deployment}

  - it: fullnameOverride wins
    set:
      fullnameOverride: tm
    asserts:
      - equal: {path: metadata.name, value: tm-api}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: metadata.name, value: tm-worker}
        template: templates/worker.yaml
      - equal: {path: metadata.name, value: tm-worker-config}
        template: templates/configmap.yaml
        documentIndex: 1

  - it: nameOverride changes the name label
    set:
      nameOverride: maint
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: "metadata.labels[\"app.kubernetes.io/name\"]", value: maint}
      - equal: {path: "spec.selector.matchLabels[\"app.kubernetes.io/name\"]", value: maint}

  - it: a long fullnameOverride is cut at 63 characters, without a dash at the cut
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-bcdef
    template: templates/worker.yaml
    asserts:
      - equal: {path: metadata.name, value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}

  - it: a role's name is cut at 63 characters too, without a dash at the cut
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    template: templates/worker.yaml
    asserts:
      - equal: {path: metadata.name, value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      - equal: {path: spec.template.spec.serviceAccountName, value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}

  - it: a long nameOverride is cut at 63 characters in the name label, without a dash at the cut
    set:
      nameOverride: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn-x
    template: templates/worker.yaml
    asserts:
      - equal: {path: 'metadata.labels["app.kubernetes.io/name"]', value: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn}

  - it: the release name and a nameOverride together are cut at 63 characters, without a dash at the cut
    set:
      nameOverride: nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn-zzz
    template: templates/worker.yaml
    asserts:
      - equal: {path: metadata.name, value: table-maintenance-nnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnnn}

suite: Volcano and RBAC can be left to someone else, and their names follow the release
templates:
  - templates/volcano.yaml
  - templates/rbac.yaml
  - templates/configmap.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
set:
  image.backend.tag: t
  image.spark.tag: t
  image.console.tag: t
tests:
  - it: volcano.create false renders no Queue and no PriorityClass but still names the queues
    set:
      volcano.create: false
    asserts:
      - hasDocuments: {count: 0}
        template: templates/volcano.yaml
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    queue: table\-maintenance$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    priority_class_prefix: table\-maintenance$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: default release keeps today's Volcano names
    template: templates/volcano.yaml
    asserts:
      - hasDocuments: {count: 6}
      - equal: {path: metadata.name, value: table-maintenance}
        documentIndex: 0
      - equal: {path: metadata.name, value: table-maintenance-urgent}
        documentIndex: 1
      - equal: {path: metadata.name, value: table-maintenance-p0}
        documentIndex: 2
      - equal: {path: metadata.name, value: table-maintenance-p3}
        documentIndex: 5

  - it: queue and class names follow the release
    release:
      name: tm2
    asserts:
      - equal: {path: metadata.name, value: tm2-table-maintenance}
        template: templates/volcano.yaml
        documentIndex: 0
      - equal: {path: metadata.name, value: tm2-table-maintenance-urgent}
        template: templates/volcano.yaml
        documentIndex: 1
      - equal: {path: metadata.name, value: tm2-table-maintenance-p0}
        template: templates/volcano.yaml
        documentIndex: 2
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    queue: tm2\-table\-maintenance$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    urgent_queue: tm2\-table\-maintenance\-urgent$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    priority_class_prefix: tm2\-table\-maintenance$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}

  - it: names given in values win
    set:
      volcano.queues.maintenance.name: shared-maint
      volcano.queues.urgent.name: shared-urgent
      volcano.priorityClassPrefix: shared
    asserts:
      - equal: {path: metadata.name, value: shared-maint}
        template: templates/volcano.yaml
        documentIndex: 0
      - equal: {path: metadata.name, value: shared-p1}
        template: templates/volcano.yaml
        documentIndex: 3
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    urgent_queue: shared\-urgent$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: rbac.create false renders no Role and no RoleBinding but keeps the ServiceAccounts
    set:
      rbac.create: false
    template: templates/rbac.yaml
    asserts:
      - hasDocuments: {count: 2}
      - isKind: {of: ServiceAccount}

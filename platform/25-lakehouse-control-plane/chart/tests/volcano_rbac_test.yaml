suite: Volcano and RBAC can be left to someone else, and their names follow the release
templates:
  - templates/volcano.yaml
  - templates/rbac.yaml
  - templates/configmap.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
values:
  - ../ci/default-values.yaml
tests:
  - it: queues and classes left to someone else render no Queue and no PriorityClass, and the jobs use their names
    set:
      maintenance.jobs.scheduling: {create: false, queues: {maintenance: {name: m}, urgent: {name: u}}, priorityClassPrefix: p}
    asserts:
      - hasDocuments: {count: 0}
        template: templates/volcano.yaml
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    queue: m$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    urgent_queue: u$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    priority_class_prefix: p$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: default release keeps today's Volcano names
    template: templates/volcano.yaml
    asserts:
      - hasDocuments: {count: 6}
      - equal: {path: metadata.name, value: table-maintenance}
        documentIndex: 0
      - equal: {path: metadata.name, value: table-maintenance-urgent}
        documentIndex: 1
      - equal: {path: metadata.name, value: table-maintenance-p0}
        documentIndex: 2
      - equal: {path: metadata.name, value: table-maintenance-p3}
        documentIndex: 5

  - it: queue and class names follow the release
    release:
      name: tm2
    asserts:
      - equal: {path: metadata.name, value: tm2-table-maintenance}
        template: templates/volcano.yaml
        documentIndex: 0
      - equal: {path: metadata.name, value: tm2-table-maintenance-urgent}
        template: templates/volcano.yaml
        documentIndex: 1
      - equal: {path: metadata.name, value: tm2-table-maintenance-p0}
        template: templates/volcano.yaml
        documentIndex: 2
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    queue: tm2\-table\-maintenance$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    urgent_queue: tm2\-table\-maintenance\-urgent$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    priority_class_prefix: tm2\-table\-maintenance$'}
        documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}

  - it: names given in values win
    set:
      maintenance.jobs.scheduling.queues.maintenance.name: shared-maint
      maintenance.jobs.scheduling.queues.urgent.name: shared-urgent
      maintenance.jobs.scheduling.priorityClassPrefix: shared
    asserts:
      - equal: {path: metadata.name, value: shared-maint}
        template: templates/volcano.yaml
        documentIndex: 0
      - equal: {path: metadata.name, value: shared-p1}
        template: templates/volcano.yaml
        documentIndex: 3
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    urgent_queue: shared\-urgent$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: the worker's permissions left to someone else render none of its Role or RoleBinding, and keep the Spark ones
    set:
      backend.worker.rbac.create: false
    template: templates/rbac.yaml
    asserts:
      - hasDocuments: {count: 4}
      - notEqual: {path: metadata.name, value: table-maintenance-worker}
        documentSelector: {path: kind, value: Role}
      - notEqual: {path: metadata.name, value: table-maintenance-worker}
        documentSelector: {path: kind, value: RoleBinding}

  - it: the Spark jobs' permissions left to someone else render none of their Role or RoleBinding, and keep the worker's
    set:
      maintenance.jobs.rbac.create: false
    template: templates/rbac.yaml
    asserts:
      - hasDocuments: {count: 4}
      - equal: {path: metadata.name, value: table-maintenance-worker}
        documentSelector: {path: kind, value: Role}
      - equal: {path: metadata.name, value: table-maintenance-worker}
        documentSelector: {path: kind, value: RoleBinding}

  - it: both left to someone else keep only the ServiceAccounts
    set:
      backend.worker.rbac.create: false
      maintenance.jobs.rbac.create: false
    template: templates/rbac.yaml
    asserts:
      - hasDocuments: {count: 2}
      - isKind: {of: ServiceAccount}

  - it: the worker may manage Spark applications and read pods in the jobs namespace only
    template: templates/rbac.yaml
    documentIndex: 1
    asserts:
      - isKind: {of: Role}
      - equal: {path: metadata.namespace, value: maintenance-jobs}
      - equal:
          path: rules
          value:
            - apiGroups: ["sparkoperator.k8s.io"]
              resources: ["sparkapplications"]
              verbs: ["create", "get", "list", "watch", "delete"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list"]

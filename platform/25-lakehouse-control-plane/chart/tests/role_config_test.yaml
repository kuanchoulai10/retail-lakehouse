suite: each backend role reads its own settings file
templates:
  - templates/configmap.yaml
  - templates/api.yaml
  - templates/worker.yaml
  - templates/event-consumer.yaml
  - templates/migrate-job.yaml
  - templates/validate.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
  revision: 1
set:
  image.backend.tag: t
  image.spark.tag: t
  image.console.tag: t
tests:
  - it: each backend role gets its own config map holding only its keys
    template: templates/configmap.yaml
    asserts:
      - hasDocuments: {count: 4}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^callback_base_url: http://table-maintenance-api\.lakehouse-control-plane\.svc\.cluster\.local:8000$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  backend: postgres$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^(http|kafka):'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^http:\n  root_path: /api$'}
        documentSelector: {path: metadata.name, value: table-maintenance-api-config}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^(callback_base_url|kafka):'}
        documentSelector: {path: metadata.name, value: table-maintenance-api-config}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^(spark|http|callback_base_url|maintenance|metrics):'}
        documentSelector: {path: metadata.name, value: table-maintenance-event-consumer-config}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^(spark|http|callback_base_url|temporal|catalog|kafka):'}
        documentSelector: {path: metadata.name, value: table-maintenance-migrate-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^database:\n  backend: postgres$'}
        documentSelector: {path: metadata.name, value: table-maintenance-migrate-config}

  - it: no config file holds a secret
    template: templates/configmap.yaml
    asserts:
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(db_url|credential:|s3_access_key_id|s3_secret_access_key|DB_PASSWORD)'}

  - it: the chart's wiring follows the release
    release:
      name: tm2
    template: templates/configmap.yaml
    documentSelector: {path: metadata.name, value: tm2-table-maintenance-worker-config}
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  service_account: tm2-table-maintenance-spark$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    queue: tm2-table-maintenance$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^    urgent_queue: tm2-table-maintenance-urgent$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  image: table-maintenance-spark:t$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^callback_base_url: http://tm2-table-maintenance-api\.lakehouse-control-plane\.svc\.cluster\.local:8000$'}

  - it: a typed knob is written only when set
    template: templates/configmap.yaml
    documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
    asserts:
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^(maintenance|log_level):'}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: 'size_[sml]'}

  - it: the maintenance knobs reach the API and the worker
    set:
      maintenance.maxAttempts: 5
      maintenance.attemptDeadlineSeconds: 900
    template: templates/configmap.yaml
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^maintenance:\n  attempt_deadline_seconds: 900\n  max_attempts: 5$'}
        documentSelector: {path: metadata.name, value: table-maintenance-api-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^maintenance:\n  attempt_deadline_seconds: 900\n  max_attempts: 5$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: a size knob is written under its size only
    set:
      spark.sizes.L.executorMemory: 3g
    template: templates/configmap.yaml
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  size_l:\n    executor_memory: 3g$'}
        documentSelector: {path: metadata.name, value: table-maintenance-api-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  size_l:\n    executor_memory: 3g$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: 'size_[sm]|driver_memory'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: the log level knob reaches every role
    set:
      logLevel: DEBUG
    template: templates/configmap.yaml
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^log_level: DEBUG$'}

  - it: config is shared and a role's config wins for that role only
    set:
      config.temporal.address: a:7233
      eventConsumer.config.temporal.address: b:7233
    template: templates/configmap.yaml
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  address: b:7233$'}
        documentSelector: {path: metadata.name, value: table-maintenance-event-consumer-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  address: a:7233$'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  address: a:7233$'}
        documentSelector: {path: metadata.name, value: table-maintenance-api-config}

  - it: config deepens the chart's wiring instead of replacing it
    set:
      config.spark.event_log_dir: s3a://other/
    template: templates/configmap.yaml
    documentSelector: {path: metadata.name, value: table-maintenance-worker-config}
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  event_log_dir: s3a://other/$'}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^  service_account: table-maintenance-spark$'}

  - it: a shared key only some roles take reaches only those
    set:
      config.kafka.topic: t
    template: templates/configmap.yaml
    asserts:
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^kafka:\n  topic: t$'}
        documentSelector: {path: metadata.name, value: table-maintenance-event-consumer-config}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^kafka:'}
        documentSelector: {path: metadata.name, value: table-maintenance-api-config}
      - notMatchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^kafka:'}
        documentSelector: {path: metadata.name, value: table-maintenance-worker-config}

  - it: a top-level config key no role takes fails before install
    set:
      config.temporl.address: x
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "config.temporl is not a setting of any role"

  - it: maintenance cannot be set for the API alone
    set:
      api.config.maintenance.max_attempts: 9
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "api.config.maintenance must be set in config, not per role: the platform settings page shows it"

  - it: Spark cannot be set for the worker alone
    set:
      worker.config.spark.size_l.executor_memory: 9g
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "worker.config.spark must be set in config, not per role: the platform settings page shows it"

  - it: discovery cannot be set for the API alone
    set:
      api.config.discovery.interval_seconds: 60
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "api.config.discovery must be set in config, not per role: the platform settings page shows it"

  - it: a role's config key that role does not take fails before install
    set:
      eventConsumer.config.metrics.prometheus_url: http://p
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "eventConsumer.config.metrics is not a setting of eventConsumer"

  - it: the containers run their subcommand with the mounted file
    template: templates/worker.yaml
    asserts:
      - equal: {path: "spec.template.spec.containers[0].args", value: [worker, --config-file=/etc/glac/config.yaml]}
      - contains:
          path: "spec.template.spec.containers[0].volumeMounts"
          content: {name: config, mountPath: /etc/glac, readOnly: true}
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: table-maintenance-worker-config}}

  - it: every role runs its own subcommand on its own file
    asserts:
      - equal: {path: "spec.template.spec.containers[0].args", value: [api, --config-file=/etc/glac/config.yaml]}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: table-maintenance-api-config}}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: "spec.template.spec.containers[0].args", value: [event-consumer, --config-file=/etc/glac/config.yaml]}
        template: templates/event-consumer.yaml
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: table-maintenance-event-consumer-config}}
        template: templates/event-consumer.yaml
      - equal: {path: "spec.template.spec.containers[0].args", value: [migrate, --config-file=/etc/glac/config.yaml]}
        template: templates/migrate-job.yaml
      - contains:
          path: spec.template.spec.volumes
          content: {name: config, configMap: {name: table-maintenance-migrate-config}}
        template: templates/migrate-job.yaml

  - it: no pod takes GLAC_COMPONENT or a shared config map any more
    asserts:
      - notContains:
          path: "spec.template.spec.containers[0].env"
          content: {name: GLAC_COMPONENT, value: worker}
        template: templates/worker.yaml
      - notExists: {path: "spec.template.spec.containers[0].envFrom[?(@.configMapRef)]"}
        template: templates/worker.yaml
      - notExists: {path: "spec.template.spec.containers[0].envFrom[?(@.configMapRef)]"}
        template: templates/event-consumer.yaml
      - notExists: {path: "spec.template.spec.containers[0].envFrom"}
        template: templates/migrate-job.yaml

  - it: the migrate config exists with the migrate job turned off
    set:
      migrate.enabled: false
    template: templates/configmap.yaml
    asserts:
      - hasDocuments: {count: 4}
      - matchRegex: {path: 'data["config.yaml"]', pattern: '(?m)^database:'}
        documentSelector: {path: metadata.name, value: table-maintenance-migrate-config}

  - it: a role turned off has no config map
    set:
      worker.enabled: false
      eventConsumer.enabled: false
      console.enabled: false
    template: templates/configmap.yaml
    asserts:
      - hasDocuments: {count: 2}

  - it: maintenance cannot be set for the worker alone through its env
    set:
      worker.env: [{name: GLAC_MAINTENANCE__MAX_ATTEMPTS, value: "9"}]
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "worker.env GLAC_MAINTENANCE__MAX_ATTEMPTS must be set in config, not per role: the platform settings page shows it"

  - it: Spark cannot be set for the API alone through its env, in any case
    set:
      api.env: [{name: glac_spark__size_l__executor_memory, value: 9g}]
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "api.env glac_spark__size_l__executor_memory must be set in config, not per role: the platform settings page shows it"

  - it: discovery cannot be set for the event consumer alone through its env
    set:
      eventConsumer.env: [{name: GLAC_DISCOVERY__INTERVAL_SECONDS, value: "60"}]
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "eventConsumer.env GLAC_DISCOVERY__INTERVAL_SECONDS must be set in config, not per role: the platform settings page shows it"

  - it: a role's own env for another block is fine
    set:
      worker.env: [{name: GLAC_LOG_LEVEL, value: DEBUG}]
    template: templates/validate.yaml
    asserts:
      - notFailedTemplate: {}

  - it: a secret in config fails before install, so no ConfigMap holds it
    set:
      config.catalog.credential: id:secret
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "config.catalog.credential is a secret: it comes from the environment, not the settings file"

  - it: a secret in a role's config fails before install
    set:
      api.config.database.postgres.db_url: postgresql://u:p@h/d
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "api.config.database.postgres.db_url is a secret: it comes from the environment, not the settings file"

  - it: an S3 key in config fails before install
    set:
      eventConsumer.config.catalog.s3_secret_access_key: k
    template: templates/validate.yaml
    asserts:
      - failedTemplate:
          errorPattern: "eventConsumer.config.catalog.s3_secret_access_key is a secret: it comes from the environment, not the settings file"

  - it: the backend pods get no service links, which would be GLAC_ variables under a release named glac
    asserts:
      - equal: {path: spec.template.spec.enableServiceLinks, value: false}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: spec.template.spec.enableServiceLinks, value: false}
        template: templates/worker.yaml
      - equal: {path: spec.template.spec.enableServiceLinks, value: false}
        template: templates/event-consumer.yaml
      - equal: {path: spec.template.spec.enableServiceLinks, value: false}
        template: templates/migrate-job.yaml

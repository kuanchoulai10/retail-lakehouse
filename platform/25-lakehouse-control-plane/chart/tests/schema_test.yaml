suite: values the chart does not know are refused, naming the key
templates:
  - templates/configmap.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
set:
  image.backend.tag: t
  image.spark.tag: t
  image.console.tag: t
tests:
  - it: unknown top-level key
    set:
      replica: 2
    asserts:
      - failedTemplate:
          errorPattern: "replica"

  - it: unknown role key
    set:
      worker.replica: 2
    asserts:
      - failedTemplate:
          errorPattern: "replica"

  - it: wrong type
    set:
      api.replicas: two
    asserts:
      - failedTemplate:
          errorPattern: "replicas"

  - it: unknown image key
    set:
      image.backend.tags: x
    asserts:
      - failedTemplate:
          errorPattern: "tags"

  - it: a secretMount without its path
    set:
      secretMounts: [{name: ca, secretName: ca-bundle}]
    asserts:
      - failedTemplate:
          errorPattern: "path"

  - it: a value nothing reads is refused
    set:
      namespaces.controlPlane: elsewhere
    asserts:
      - failedTemplate:
          errorPattern: "controlPlane"

  - it: a tag must be a string, so a short SHA of digits is never turned into a number
    set:
      image.backend.tag: 1234567
    asserts:
      - failedTemplate:
          errorPattern: "/image/backend/tag"

  - it: commonLabels may not take over a label the chart sets
    set:
      commonLabels:
        app.kubernetes.io/part-of: other
    asserts:
      - failedTemplate:
          errorPattern: "commonLabels"

  - it: a role's workload labels may not take over a label the chart sets
    set:
      worker.labels:
        helm.sh/chart: other
    asserts:
      - failedTemplate:
          errorPattern: "/worker/labels"

  - it: a role's pod labels may not take over a selector label
    set:
      api.podLabels:
        app.kubernetes.io/component: other
    asserts:
      - failedTemplate:
          errorPattern: "/api/podLabels"

  - it: labels of our own prefix are fine
    set:
      commonLabels:
        retail-lakehouse.io/team: data
      api.podLabels:
        retail-lakehouse.io/exposed: "true"
    asserts:
      - notFailedTemplate: {}

  - it: the e2e overlay is known values
    values:
      - ../values-e2e.yaml
    asserts:
      - notFailedTemplate: {}

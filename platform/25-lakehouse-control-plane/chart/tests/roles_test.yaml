suite: each role has its own block
templates:
  - templates/api.yaml
  - templates/configmap.yaml
  - templates/worker.yaml
  - templates/event-consumer.yaml
  - templates/migrate-job.yaml
  - templates/console.yaml
  - templates/rbac.yaml
release:
  name: table-maintenance
  namespace: lakehouse-control-plane
values:
  - ../ci/default-values.yaml
tests:
  - it: replicas
    set:
      backend.api.replicas: 3
      backend.worker.replicas: 2
      frontend.console.replicas: 2
    asserts:
      - equal: {path: spec.replicas, value: 3}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - equal: {path: spec.replicas, value: 2}
        template: templates/worker.yaml
      - equal: {path: spec.replicas, value: 2}
        template: templates/console.yaml
        documentSelector: {path: kind, value: Deployment}

  - it: scheduling lands on its own role's pods only
    set:
      backend.worker.nodeSelector: {pool: maint}
      backend.worker.tolerations: [{key: k, operator: Exists}]
      backend.worker.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions: [{key: pool, operator: In, values: [maint]}]
      backend.migrate.nodeSelector: {pool: batch}
    asserts:
      - equal: {path: spec.template.spec.nodeSelector, value: {pool: maint}}
        template: templates/worker.yaml
      - equal: {path: spec.template.spec.tolerations, value: [{key: k, operator: Exists}]}
        template: templates/worker.yaml
      - exists: {path: spec.template.spec.affinity.nodeAffinity}
        template: templates/worker.yaml
      - equal: {path: spec.template.spec.nodeSelector, value: {pool: batch}}
        template: templates/migrate-job.yaml
      - notExists: {path: spec.template.spec.nodeSelector}
        template: templates/api.yaml
        documentSelector: {path: kind, value: Deployment}
      - notExists: {path: spec.template.spec.tolerations}
        template: templates/event-consumer.yaml
      - notExists: {path: spec.template.spec.affinity}
        template: templates/console.yaml
        documentSelector: {path: kind, value: Deployment}

  - it: workload and pod labels and annotations go where they say
    set:
      backend.api.labels: {a: "1"}
      backend.api.annotations: {note: workload}
      backend.api.podLabels: {b: "2"}
      backend.api.podAnnotations: {c: "3"}
    template: templates/api.yaml
    documentSelector: {path: kind, value: Deployment}
    asserts:
      - equal: {path: metadata.labels.a, value: "1"}
      - equal: {path: metadata.annotations.note, value: workload}
      - notExists: {path: spec.template.metadata.labels.a}
      - equal: {path: spec.template.metadata.labels.b, value: "2"}
      - notExists: {path: metadata.labels.b}
      - notExists: {path: spec.selector.matchLabels.b}
      - equal: {path: spec.template.metadata.annotations.c, value: "3"}
      - exists: {path: "spec.template.metadata.annotations[\"checksum/config\"]"}

  - it: an existing worker ServiceAccount is used and none is created
    set:
      backend.worker.serviceAccount.create: false
      backend.worker.serviceAccount.name: existing-sa
    asserts:
      - equal: {path: spec.template.spec.serviceAccountName, value: existing-sa}
        template: templates/worker.yaml
      - hasDocuments: {count: 5}
        template: templates/rbac.yaml
      - equal: {path: "subjects[0].name", value: existing-sa}
        template: templates/rbac.yaml
        documentIndex: 1

  - it: an existing Spark ServiceAccount is used and none is created
    set:
      maintenance.jobs.serviceAccount.create: false
      maintenance.jobs.serviceAccount.name: existing-spark
    asserts:
      - hasDocuments: {count: 5}
        template: templates/rbac.yaml
      - equal: {path: "subjects[0].name", value: existing-spark}
        template: templates/rbac.yaml
        documentIndex: 4

  - it: serviceAccount annotations land on the ServiceAccounts
    set:
      backend.worker.serviceAccount.annotations: {w: "1"}
      maintenance.jobs.serviceAccount.annotations: {s: "2"}
    template: templates/rbac.yaml
    asserts:
      - equal: {path: metadata.annotations.w, value: "1"}
        documentIndex: 0
      - equal: {path: metadata.annotations.s, value: "2"}
        documentIndex: 3

  - it: imagePullSecrets reach every pod
    set:
      imagePullSecrets: [{name: regcred}]
    asserts:
      - equal: {path: spec.template.spec.imagePullSecrets, value: [{name: regcred}]}
        template: templates/worker.yaml
      - equal: {path: spec.template.spec.imagePullSecrets, value: [{name: regcred}]}
        template: templates/migrate-job.yaml
      - equal: {path: spec.template.spec.imagePullSecrets, value: [{name: regcred}]}
        template: templates/console.yaml
        documentSelector: {path: kind, value: Deployment}

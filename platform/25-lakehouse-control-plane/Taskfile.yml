# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  HELM_UNITTEST_VERSION: 1.2.1
  KUBECONFORM_VERSION: v0.8.0
  CHECKS: uv run --no-project --with pyyaml python {{.TASKFILE_DIR}}/../../scripts/check_chart_manifests.py

tasks:
  unit-test:
    desc: "Run the wave-25 chart's helm-unittest suites and lint it with each scenario and the minikube environment"
    cmds:
      - cmd: |
          installed="$(helm plugin list | awk '$1 == "unittest" {print $2}')"
          if [ "${installed}" != "{{.HELM_UNITTEST_VERSION}}" ]; then
            echo "helm-unittest {{.HELM_UNITTEST_VERSION}} is required (found '${installed:-none}'). Install it with its signature checked:" >&2
            echo "  gh api 'repos/helm-unittest/helm-unittest/contents/public-key.asc?ref=v{{.HELM_UNITTEST_VERSION}}' --jq .content | base64 -d | gpg --dearmor > /tmp/helm-unittest-pubring.gpg" >&2
            echo "  helm plugin uninstall unittest 2>/dev/null; helm plugin install https://github.com/helm-unittest/helm-unittest/releases/download/v{{.HELM_UNITTEST_VERSION}}/unittest-{{.HELM_UNITTEST_VERSION}}.tgz --keyring /tmp/helm-unittest-pubring.gpg" >&2
            exit 1
          fi
      - cmd: helm unittest chart
      - cmd: |
          for values in chart/ci/*-values.yaml; do
            [ -e "${values}" ] || continue
            helm lint chart --values "${values}"
            helm template table-maintenance chart --namespace lakehouse-control-plane --values "${values}" >/dev/null
          done
      - cmd: |
          tags="--set-string backend.image.tag=lint --set-string maintenance.jobs.image.tag=lint --set-string frontend.image.tag=lint"
          helm lint chart --values values/minikube.yaml ${tags}
          helm lint chart --values values/minikube.yaml --values values/e2e.yaml ${tags}

  mutation-test:
    desc: "Break the wave-25 chart's templates and schema one way at a time and list the mutants its unit tests and manifest checks miss"
    cmds:
      - task: kubeconform-installed
      - cmd: |
          uv run --no-project --with pyyaml python ../../scripts/mutate_chart.py chart \
            --test-command "sh -c 'helm unittest {chart} >/dev/null && {{.CHECKS}} {chart} >/dev/null'"

  security-test:
    desc: "Check every chart/ci/*-values.yaml rendering against the Kubernetes and CRD schemas, the label standard and the deployment rules"
    cmds:
      - task: kubeconform-installed
      - cmd: "{{.CHECKS}} chart"

  kubeconform-installed:
    internal: true
    cmds:
      - cmd: |
          installed="$(kubeconform -v 2>/dev/null || true)"
          if [ "${installed}" != "{{.KUBECONFORM_VERSION}}" ]; then
            echo "kubeconform {{.KUBECONFORM_VERSION}} is required (found '${installed:-none}'). Install it with: brew install kubeconform" >&2
            exit 1
          fi

  schemas:
    desc: "Write the HTTPRoute and Volcano Queue schemas kubeconform reads, from wave 11's vendored CRD and the cluster's Volcano CRD"
    requires:
      vars: [KUBE_CONTEXT]
    cmds:
      - cmd: |
          crds="$(mktemp -d)"
          trap 'find "${crds}" -delete' EXIT
          yq 'select(.metadata.name == "httproutes.gateway.networking.k8s.io")' ../11-gateway-api-crds/manifests/standard-install-v1.3.0.yaml > "${crds}/httproute.yaml"
          kubectl get crd queues.scheduling.volcano.sh -o yaml --context "{{.KUBE_CONTEXT}}" > "${crds}/queue.yaml"
          uv run --no-project --with pyyaml python ../../scripts/crd_json_schemas.py "${crds}/httproute.yaml" "${crds}/queue.yaml" --out schemas/crds

  build-test:
    desc: "Package the wave-25 chart once, versioned by commit"
    cmds:
      - cmd: echo "TODO:// helm package the chart with the build.sh source tag and push it to the chart registry"

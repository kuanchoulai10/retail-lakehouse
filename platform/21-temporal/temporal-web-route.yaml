apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: temporal-web
  namespace: temporal
spec:
  parentRefs:
    - name: platform-gateway
      namespace: istio-ingress
  hostnames:
    - temporal.localhost
  rules:
    - backendRefs:
        - name: temporal-web
          port: 8080

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-gateway
  namespace: istio-ingress
  annotations:
    networking.istio.io/service-type: ClusterIP
  labels:
    app.kubernetes.io/name: platform-gateway
    app.kubernetes.io/instance: platform-gateway
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: platform-gateway
    app.kubernetes.io/managed-by: kubectl
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      hostname: "*.localhost"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              retail-lakehouse.io/gateway-routes: allowed

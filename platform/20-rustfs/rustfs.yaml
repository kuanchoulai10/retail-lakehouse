# --8<-- [start:deployment]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: object-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - chown -R 10001:10001 /data
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: storage
              mountPath: /data
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.3
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
          envFrom:
            - secretRef:
                name: rustfs-secret
          resources:
            requests:
              memory: 1638Mi
            limits:
              memory: 3072Mi
          ports:
            - containerPort: 9000
              protocol: TCP
            - containerPort: 9001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /data
      volumes:
        - name: storage
          hostPath:
            path: /home/docker/data/rustfs
            type: DirectoryOrCreate
      restartPolicy: Always
# --8<-- [end:deployment]
---
# --8<-- [start:services]
apiVersion: v1
kind: Service
metadata:
  name: rustfs-console
  namespace: object-storage
spec:
  selector:
    app: rustfs
  type: NodePort
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: object-storage
spec:
  selector:
    app: rustfs
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
# --8<-- [end:services]
---
# --8<-- [start:job]
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  namespace: object-storage
spec:
  backoffLimit: 6
  completions: 1
  template:
    metadata:
      labels:
        job: rustfs-create-bucket
    spec:
      initContainers:
        - name: wait-for-rustfs
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              until nc -z rustfs.object-storage.svc.cluster.local 9000; do
                echo "Waiting for RustFS..."
                sleep 2
              done
              echo "RustFS is ready!"
      containers:
        - name: rustfs-create-buckets
          image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
          envFrom:
            - secretRef:
                name: rustfs-secret
          command:
            - sh
            - -c
            - |
              mc alias set rustfs http://rustfs.object-storage.svc.cluster.local:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" &&
              for bucket in retail-lakehouse-7dj2 trino-fault-tolerance-nkm5 trino-fault-tolerance-cws0 thanos; do
                if ! mc ls rustfs/$bucket >/dev/null 2>&1; then
                  echo "Creating bucket: $bucket"
                  mc mb rustfs/$bucket
                  echo "Bucket created: $bucket"
                else
                  echo "Bucket already exists: $bucket"
                fi
              done
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
# --8<-- [end:job]

# --8<-- [start:deployment]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: object-storage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      initContainers:
        - name: fix-data-permissions
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - chown -R 10001:10001 /data /notify-queue
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: notify-queue
              mountPath: /notify-queue
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.3
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            - name: RUSTFS_NOTIFY_ENABLE
              value: "true"
            - name: RUSTFS_NOTIFY_KAFKA_ENABLE_SPARK_EVENT_LOGS
              value: "on"
            - name: RUSTFS_NOTIFY_KAFKA_BROKERS_SPARK_EVENT_LOGS
              value: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: RUSTFS_NOTIFY_KAFKA_TOPIC_SPARK_EVENT_LOGS
              value: spark-event-log-completions
            - name: RUSTFS_NOTIFY_KAFKA_ACKS_SPARK_EVENT_LOGS
              value: "-1"
            - name: RUSTFS_NOTIFY_KAFKA_QUEUE_DIR_SPARK_EVENT_LOGS
              value: /notify-queue/spark-event-logs
          envFrom:
            - secretRef:
                name: rustfs-secret
          resources:
            requests:
              memory: 1638Mi
            limits:
              memory: 3072Mi
          ports:
            - containerPort: 9000
              protocol: TCP
            - containerPort: 9001
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: notify-queue
              mountPath: /notify-queue
      volumes:
        - name: storage
          hostPath:
            path: /home/docker/data/rustfs
            type: DirectoryOrCreate
        - name: notify-queue
          hostPath:
            path: /home/docker/data/rustfs-notify-queue
            type: DirectoryOrCreate
      restartPolicy: Always
# --8<-- [end:deployment]
---
# --8<-- [start:services]
apiVersion: v1
kind: Service
metadata:
  name: rustfs-console
  namespace: object-storage
spec:
  selector:
    app: rustfs
  type: NodePort
  ports:
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 30901
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: object-storage
spec:
  selector:
    app: rustfs
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
# --8<-- [end:services]
---
# --8<-- [start:job]
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-create-bucket
  namespace: object-storage
spec:
  backoffLimit: 6
  completions: 1
  template:
    metadata:
      labels:
        job: rustfs-create-bucket
    spec:
      initContainers:
        - name: wait-for-rustfs
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - |
              until nc -z rustfs.object-storage.svc.cluster.local 9000; do
                echo "Waiting for RustFS..."
                sleep 2
              done
              echo "RustFS is ready!"
        - name: rustfs-create-buckets
          image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
          envFrom:
            - secretRef:
                name: rustfs-secret
          command:
            - sh
            - -c
            - |
              mc alias set rustfs http://rustfs.object-storage.svc.cluster.local:9000 "$RUSTFS_ACCESS_KEY" "$RUSTFS_SECRET_KEY" &&
              for bucket in retail-lakehouse-7dj2 trino-fault-tolerance-nkm5 trino-fault-tolerance-cws0 thanos spark-event-logs; do
                if ! mc ls rustfs/$bucket >/dev/null 2>&1; then
                  echo "Creating bucket: $bucket"
                  mc mb rustfs/$bucket
                  echo "Bucket created: $bucket"
                else
                  echo "Bucket already exists: $bucket"
                fi
              done
      containers:
        - name: rustfs-configure-spark-event-logs
          image: amazon/aws-cli:2.38.1
          envFrom:
            - secretRef:
                name: rustfs-secret
          env:
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: when_required
          command:
            - sh
            - -ec
            - |
              export AWS_ACCESS_KEY_ID="$RUSTFS_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$RUSTFS_SECRET_KEY"
              endpoint=http://rustfs.object-storage.svc.cluster.local:9000
              aws --endpoint-url "$endpoint" s3api put-bucket-lifecycle-configuration \
                --bucket spark-event-logs \
                --lifecycle-configuration '{"Rules":[{"ID":"expire-after-3-days","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":3}}]}'
              echo "Lifecycle set: spark-event-logs expires objects after 3 days"
              aws --endpoint-url "$endpoint" s3api put-bucket-notification-configuration \
                --bucket spark-event-logs \
                --notification-configuration '{"QueueConfigurations":[{"Id":"spark-event-log-completions","QueueArn":"arn:rustfs:sqs:us-east-1:spark_event_logs:kafka","Events":["s3:ObjectCreated:Copy"],"Filter":{"Key":{"FilterRules":[{"Name":"prefix","Value":"eventlog_v2_"}]}}}]}'
              echo "Notification set: spark-event-logs s3:ObjectCreated:Copy eventlog_v2_* -> spark_event_logs Kafka target"
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 30
# --8<-- [end:job]

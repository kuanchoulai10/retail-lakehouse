apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: table-maintenance-db
  namespace: lakehouse-control-plane
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: table-maintenance-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: table-maintenance
    app.kubernetes.io/managed-by: kubectl
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

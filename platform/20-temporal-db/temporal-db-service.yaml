apiVersion: v1
kind: Service
metadata:
  name: temporal-db
  namespace: temporal
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: temporal-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: temporal
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: temporal-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debezium-role-binding
  namespace: kafka
  labels:
    app.kubernetes.io/name: debezium
    app.kubernetes.io/instance: debezium-mysql
    app.kubernetes.io/component: cdc-source
    app.kubernetes.io/part-of: cdc
    app.kubernetes.io/managed-by: kubectl
subjects:
- kind: ServiceAccount
  name: debezium-connect-cluster-connect
  namespace: kafka
roleRef:
  kind: Role
  name: debezium-role
  apiGroup: rbac.authorization.k8s.io
# --8<-- [start:cluster]
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-cluster
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: kafka
    app.kubernetes.io/managed-by: kubectl
spec:
  kafka:
    version: 4.0.0
    metadataVersion: 4.0-IV3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      default.replication.factor: 3
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      min.insync.replicas: 2
    template:
      pod:
        metadata:
          labels:
            version: "4.0.0"
        securityContext:
          runAsUser: 0
          fsGroup: 0
  entityOperator:
    topicOperator: {}
    userOperator: {}
# --8<-- [end:cluster]
---
# --8<-- [start:nodepool]
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka-cluster
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: kafka-cluster
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: kafka
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 3
  roles:
    - controller
    - broker
  jvmOptions:
    "-Xms": 1g
    "-Xmx": 1g
  resources:
    requests:
      memory: 1536Mi
    limits:
      memory: 2560Mi
  storage:
    type: jbod
    volumes:
      - id: 1
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
        kraftMetadata: shared
# --8<-- [end:nodepool]

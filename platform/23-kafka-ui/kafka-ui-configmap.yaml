apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
  namespace: kafka-ui
  labels:
    app.kubernetes.io/name: kafka-ui
    app.kubernetes.io/instance: kafka-ui
    app.kubernetes.io/component: ui
    app.kubernetes.io/part-of: kafka-ui
    app.kubernetes.io/managed-by: kubectl
data:
  config.yml: |
    kafka:
      clusters:
        - name: retail-lakehouse
          bootstrapServers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
          kafkaConnect:
            - name: debezium-connect-cluster
              address: http://debezium-connect-cluster-connect-api.kafka.svc.cluster.local:8083
            - name: iceberg-connect-cluster
              address: http://iceberg-connect-cluster-connect-api.kafka.svc.cluster.local:8083
    auth:
      type: DISABLED
    management:
      health:
        kafka:
          enabled: true

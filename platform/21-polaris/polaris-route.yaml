apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: polaris
  namespace: lakehouse-catalog
spec:
  parentRefs:
    - name: platform-gateway
      namespace: istio-ingress
  hostnames:
    - polaris.localhost
  rules:
    - backendRefs:
        - name: polaris
          port: 8181

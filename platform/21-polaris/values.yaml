polaris:
  image:
    repository: apache/polaris
    tag: "1.8.0"
    pullPolicy: IfNotPresent

  podLabels:
    app.kubernetes.io/version: "1.8.0"

  replicaCount: 1

  # ---------------------------------------------------------------------------
  # Persistence
  # ---------------------------------------------------------------------------
  persistence:
    type: relational-jdbc
    relationalJdbc:
      # The Secret 'polaris-db' is created by platform/20-polaris-db/ in the same namespace.
      # It exposes 'username', 'password', and 'jdbcUrl' keys.
      secret:
        name: polaris-db
        username: username
        password: password
        jdbcUrl: jdbcUrl

  # ---------------------------------------------------------------------------
  # Storage credentials (RustFS)
  # ---------------------------------------------------------------------------
  # Injected as polaris.storage.aws.access-key / polaris.storage.aws.secret-key
  # (Polaris-native Quarkus properties). Used by Polaris for catalog storage
  # operations (writing metadata, vended credentials flow).
  storage:
    secret:
      name: polaris-storage-secret
      awsAccessKeyId: awsAccessKeyId
      awsSecretAccessKey: awsSecretAccessKey

  # ---------------------------------------------------------------------------
  # Environment variables — S3/STS endpoint and bootstrap credentials
  # ---------------------------------------------------------------------------
  # AWS SDK reads AWS_ENDPOINT_URL_S3 / AWS_ENDPOINT_URL_STS to redirect all
  # S3 and STS calls to RustFS instead of real AWS.
  # POLARIS_BOOTSTRAP_CREDENTIALS creates the initial admin principal on first start.
  # Format: <realm>,<username>,<password>  (comma-separated, no spaces)
  extraEnv:
    - name: AWS_REGION
      value: "dummy-region"
    - name: AWS_ENDPOINT_URL_S3
      value: "http://rustfs.object-storage.svc.cluster.local:9000"
    - name: AWS_ENDPOINT_URL_STS
      value: "http://rustfs.object-storage.svc.cluster.local:9000"
    - name: POLARIS_BOOTSTRAP_CREDENTIALS
      valueFrom:
        secretKeyRef:
          name: polaris-bootstrap-secret
          key: credentials

  authentication:
    type: internal
    tokenBroker:
      type: rsa-key-pair
      maxTokenGeneration: PT1H
      secret:
        name: polaris-token-broker
        rsaKeyPair:
          publicKey: public.pem
          privateKey: private.pem

  realmContext:
    type: default
    realms:
      - POLARIS

  tracing:
    enabled: false

  metrics:
    enabled: true

  serviceMonitor:
    enabled: true
    labels: {}

  service:
    type: ClusterIP
    ports:
      - name: polaris-http
        port: 8181

  advancedConfig:
    polaris.iceberg-metrics.reporting.type: persisting
    polaris.event-listener.types: kafka
    polaris.event-listener.kafka.topic: polaris-catalog-events
    polaris.event-listener.kafka.synchronous-mode: "false"
    polaris.event-listener.kafka.properties.bootstrap.servers: kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
    polaris.event-listener.kafka.properties.max.block.ms: "5000"

apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  namespace: lakehouse-catalog
  labels:
    app.kubernetes.io/name: polaris
    app.kubernetes.io/instance: polaris-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: polaris
    app.kubernetes.io/managed-by: kubectl
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: polaris
        app.kubernetes.io/instance: polaris-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: polaris
        app.kubernetes.io/managed-by: kubectl
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: create-schema
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - psql "postgresql://$PGUSER@polaris-db.lakehouse-catalog.svc.cluster.local:5432/$PGDATABASE" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS polaris_schema'
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: database
      containers:
        - name: bootstrap
          image: apache/polaris-admin-tool:1.8.0
          args:
            - bootstrap
            - --realm=POLARIS
            - --credential=POLARIS,root,secret
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: relational-jdbc
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: password
            - name: QUARKUS_DATASOURCE_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: polaris-db
                  key: jdbcUrl

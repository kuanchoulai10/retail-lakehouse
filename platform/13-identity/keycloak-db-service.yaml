apiVersion: v1
kind: Service
metadata:
  name: keycloak-db
  namespace: identity
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: keycloak-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: identity
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: keycloak-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

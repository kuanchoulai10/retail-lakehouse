apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: identity
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy
    app.kubernetes.io/component: auth-proxy
    app.kubernetes.io/part-of: identity
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: oauth2-proxy
  ports:
    - name: http
      port: 4180
      targetPort: http

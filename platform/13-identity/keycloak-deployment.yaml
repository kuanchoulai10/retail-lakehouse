apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/instance: keycloak
    app.kubernetes.io/component: identity-provider
    app.kubernetes.io/part-of: identity
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
      app.kubernetes.io/instance: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/instance: keycloak
        app.kubernetes.io/component: identity-provider
        app.kubernetes.io/part-of: identity
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/version: "26.8.2"
      annotations:
        retail-lakehouse.io/public-origin: "${PUBLIC_ORIGIN}"
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.2
          args:
            - start
            - --import-realm
          env:
            - name: PUBLIC_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: public-origin
                  key: origin
            - name: KC_HOSTNAME
              value: $(PUBLIC_ORIGIN)/keycloak
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: /keycloak
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_CACHE
              value: local
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: keycloak-db.identity.svc.cluster.local
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: database
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db
                  key: password
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-clients
                  key: oauth2-proxy-client-secret
            - name: TRINO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-clients
                  key: trino-client-secret
            - name: PLATFORM_VALIDATE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-clients
                  key: platform-validate-client-secret
            - name: PLATFORM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-clients
                  key: platform-admin-password
            - name: JAVA_OPTS_KC_HEAP
              value: -Xms256m -Xmx512m -XX:MaxMetaspaceSize=256m
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          resources:
            requests:
              memory: 640Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /keycloak/health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /keycloak/health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /keycloak/health/live
              port: management
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm

apiVersion: v1
kind: ConfigMap
metadata:
  name: table-metrics-prometheus
  namespace: table-metrics
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: table-metrics-prometheus
    app.kubernetes.io/part-of: table-maintenance
    app.kubernetes.io/component: metrics-store
    app.kubernetes.io/managed-by: kubectl
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: table-maintenance-api
        metrics_path: /v1/table-metrics
        static_configs:
          - targets:
              - table-maintenance-api.lakehouse-control-plane.svc.cluster.local:8000

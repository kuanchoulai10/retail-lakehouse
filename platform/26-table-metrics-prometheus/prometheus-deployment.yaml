apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-metrics-prometheus
  namespace: table-metrics
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: table-metrics-prometheus
    app.kubernetes.io/part-of: table-maintenance
    app.kubernetes.io/component: metrics-store
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: table-metrics-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/instance: table-metrics-prometheus
        app.kubernetes.io/part-of: table-maintenance
        app.kubernetes.io/component: metrics-store
        app.kubernetes.io/managed-by: kubectl
        app.kubernetes.io/version: "v3.5.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --storage.tsdb.retention.size=1GB
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: table-metrics-prometheus
        - name: data
          persistentVolumeClaim:
            claimName: table-metrics-prometheus

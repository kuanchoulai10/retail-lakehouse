apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ecommerce-app
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce-app
    app.kubernetes.io/managed-by: kubectl
spec:
  ports:
  - port: 3306
  selector:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: ecommerce-app
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/instance: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: ecommerce-app
    app.kubernetes.io/managed-by: kubectl
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
      app.kubernetes.io/instance: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/instance: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: ecommerce-app
        app.kubernetes.io/managed-by: kubectl
    spec:
      containers:
      - image: quay.io/debezium/example-mysql:2.7.3.Final
        name: mysql
        envFrom:
        - secretRef:
            name: mysql-secret
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: mysql
